<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas DNS Cross-check</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #020a18;
      font-family: 'DejaVu Sans Mono', 'Courier New', monospace;
      color: #4a8aaa;
      min-height: 100vh;
    }
    body::after {
      content: ''; position: fixed; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
      pointer-events: none; z-index: 100;
    }

    nav {
      display: flex; align-items: center; gap: 1rem;
      padding: 0.55rem 1.2rem;
      border-bottom: 1px solid #041828;
      background: rgba(2,10,24,0.95);
      backdrop-filter: blur(8px);
      position: sticky; top: 0; z-index: 50;
    }
    nav a { color: #5a9ab8; font-size: 0.68rem; text-decoration: none; letter-spacing: 0.12em; transition: color .2s; }
    nav a:hover { color: #00ffcc; }
    .brand { font-size: 0.78rem; font-weight: bold; letter-spacing: 0.25em; color: #5a8fb8; }
    #status { margin-left: auto; font-size: 0.62rem; color: #5a8fb8; letter-spacing: 0.08em; }

    .page { max-width: 1200px; margin: 0 auto; padding: 1.4rem 1.4rem 3rem; }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.9rem; margin-bottom: 1.6rem;
    }
    .stat-card {
      background: rgba(4,14,30,0.9);
      border: 1px solid #0a2a40;
      border-radius: 12px; padding: 1rem 1.2rem;
    }
    .stat-label { font-size: 0.58rem; letter-spacing: 0.14em; color: #5a8fb8; margin-bottom: 0.4rem; }
    .stat-val   { font-size: 2rem; font-weight: bold; letter-spacing: -1px; }
    .stat-sub   { font-size: 0.65rem; color: #5a8fb8; margin-top: 0.3rem; }
    .c-green  { color: #00cc88; }
    .c-red    { color: #ff4444; }
    .c-blue   { color: #00aaff; }
    .c-teal   { color: #00ffcc; }
    .c-amber  { color: #ffaa00; }

    .section-title { font-size: 0.62rem; letter-spacing: 0.2em; color: #5a8fb8; margin: 1.4rem 0 0.7rem; }

    .tbl-wrap { overflow-x: auto; border: 1px solid #0a2a40; border-radius: 12px; background: rgba(4,14,30,0.9); }
    table { width: 100%; border-collapse: collapse; font-size: 0.74rem; }
    th {
      text-align: left; font-size: 0.58rem; letter-spacing: 0.14em; color: #5a8fb8;
      padding: 0.7rem 0.9rem; border-bottom: 1px solid #0a2a40; font-weight: normal;
    }
    td { padding: 0.55rem 0.9rem; border-bottom: 1px solid #061c30; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    td.domain { color: #cde3f0; }
    td.ips { color: #7aa8c0; font-size: 0.68rem; line-height: 1.5; }
    td .note { color: #4a6a80; font-size: 0.64rem; display: block; margin-top: 0.2rem; }

    .pill {
      display: inline-block; padding: 0.14rem 0.55rem; border-radius: 999px;
      font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase;
      border: 1px solid currentColor;
    }
    .pill-blocked   { color: #8aa0b0; }
    .pill-agree     { color: #00cc88; }
    .pill-cdn       { color: #00aaff; }
    .pill-flag      { color: #ff4444; background: rgba(255,68,68,0.08); }
    .pill-warn      { color: #ffaa00; }
    .pill-nodata    { color: #4a6a80; }

    .foot { margin-top: 1.2rem; font-size: 0.62rem; color: #3a5a70; }
    .foot a { color: inherit; }
    .err-banner {
      border: 1px solid #5a2a2a; background: rgba(58,26,26,0.4); color: #f87171;
      border-radius: 12px; padding: 0.9rem 1.2rem; font-size: 0.75rem; margin-bottom: 1.4rem;
    }
  </style>
</head>
<body>

<nav>
  <a href="/">&larr; HOME</a>
  <a href="/pihole">PI-HOLE</a>
  <a href="/cross_ref">CROSS-REF</a>
  <span class="brand">&middot; ATLAS DNS &middot;</span>
  <span id="status">LOADING...</span>
</nav>

<div class="page">
  <div id="banner"></div>
  <div class="stat-grid" id="stats"></div>

  <div class="section-title">CANARY DOMAINS — WORLD VS PI-HOLE</div>
  <div class="tbl-wrap">
    <table>
      <thead>
        <tr><th>DOMAIN</th><th>GROUP</th><th>STATUS</th><th>PI-HOLE ANSWER</th><th>GLOBAL CONSENSUS</th><th>OWN PROBE</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <p class="foot" id="updated"></p>
</div>

<script>
  // all rendered strings are external data (DNS answers) — escape everything
  const esc = s => String(s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const PILLS = {
    blocked:            ['pill-blocked', 'BLOCKED ✓'],
    agree:              ['pill-agree',   'AGREE'],
    cdn_variance:       ['pill-cdn',     'CDN VARIANCE'],
    divergent:          ['pill-flag',    'DIVERGENT'],
    own_path_divergent: ['pill-flag',    'OWN PATH ⚠'],
    unexpected_block:   ['pill-flag',    'UNEXPECTED BLOCK'],
    unblocked:          ['pill-warn',    'NOT BLOCKED'],
    no_data:            ['pill-nodata',  'NO DATA'],
    no_measurement:     ['pill-nodata',  'NO MEASUREMENT'],
  };
  const FLAGS = ['divergent', 'own_path_divergent', 'unexpected_block', 'unblocked'];

  function ipList(ips) {
    if (!ips || !ips.length) return '<span style="color:#3a5a70">—</span>';
    return ips.map(esc).join('<br>');
  }

  async function load() {
    const r = await fetch('/api/atlas?t=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();

    const flagged = d.domains.filter(x => FLAGS.includes(x.status));
    const blocked = d.domains.filter(x => x.status === 'blocked').length;

    document.getElementById('banner').innerHTML = flagged.length
      ? `<div class="err-banner">⚠ ${flagged.length} domain(s) flagged: ` +
        flagged.map(f => esc(f.domain)).join(', ') + '</div>'
      : '';

    document.getElementById('stats').innerHTML = `
      <div class="stat-card">
        <div class="stat-label">FLAGGED</div>
        <div class="stat-val ${flagged.length ? 'c-red' : 'c-green'}">${flagged.length}</div>
        <div class="stat-sub">of ${d.domains.length} canary domains</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">BLOCKS CONFIRMED</div>
        <div class="stat-val c-teal">${blocked}</div>
        <div class="stat-sub">nulled here, live elsewhere</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">PROBE ${esc(d.probe?.id ?? '?')}</div>
        <div class="stat-val ${d.probe?.connected ? 'c-green' : 'c-red'}">${d.probe?.connected ? 'UP' : 'DOWN'}</div>
        <div class="stat-sub">our RIPE Atlas probe</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">CREDITS</div>
        <div class="stat-val c-blue">${(d.credits?.balance ?? 0).toLocaleString()}</div>
        <div class="stat-sub">+${(d.credits?.daily_income ?? 0).toLocaleString()}/day earned</div>
      </div>
    `;

    const order = s => FLAGS.includes(s) ? 0 : s === 'unblocked' ? 1 : 2;
    const rows = [...d.domains].sort((a, b) => order(a.status) - order(b.status));
    document.getElementById('rows').innerHTML = rows.map(x => {
      const [cls, label] = PILLS[x.status] || ['pill-nodata', esc(x.status)];
      return `<tr>
        <td class="domain">${esc(x.domain)}${x.note ? `<span class="note">${esc(x.note)}</span>` : ''}</td>
        <td>${esc(x.group)}</td>
        <td><span class="pill ${cls}">${label}</span></td>
        <td class="ips">${ipList(x.pihole_ips)}</td>
        <td class="ips">${ipList(x.global_ips)}</td>
        <td class="ips">${ipList(x.own_ip)}</td>
      </tr>`;
    }).join('');

    const age = Math.round((Date.now() / 1000 - d.ts) / 60);
    document.getElementById('status').textContent =
      `${flagged.length ? flagged.length + ' FLAGGED' : 'ALL CLEAR'} · ${blocked} BLOCKS CONFIRMED`;
    document.getElementById('updated').innerHTML =
      `Measured hourly from ${esc(String(1 + 3))} probes via 9.9.9.10 · checked every 15 min · ` +
      `last poll ${age} min ago · <a href="/api/atlas">JSON</a>`;
  }

  load().catch(e => {
    document.getElementById('status').textContent = 'ERROR: ' + e.message;
    document.getElementById('banner').innerHTML =
      '<div class="err-banner">No atlas.json yet — run scripts/atlas_bootstrap.py, then pollers/atlas.py.</div>';
  });
  setInterval(() => load().catch(() => {}), 60000);
</script>
</body>
</html>
