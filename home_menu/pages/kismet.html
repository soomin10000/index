<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wireless · Kismet</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #07070f; --card: rgba(14,14,26,0.85); --border: rgba(255,255,255,0.07); --a: #a78bfa; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: #e0e0e0; padding: 1.5rem; min-height: 100vh; }

    .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .bg span { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.13; animation: drift linear infinite alternate; }
    .bg span:nth-child(1) { width:500px;height:500px;background:#7c3aed;top:-10%;left:-10%;animation-duration:30s; }
    .bg span:nth-child(2) { width:400px;height:400px;background:#2060ff;top:10%;right:-5%;animation-duration:22s;animation-delay:-8s; }
    .bg span:nth-child(3) { width:350px;height:350px;background:#059669;bottom:5%;left:30%;animation-duration:27s;animation-delay:-14s; }
    @keyframes drift { from{transform:translate(0,0) scale(1)} to{transform:translate(40px,30px) scale(1.1)} }

    .content { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; }

    header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
    header a { color: #444; text-decoration: none; font-size: 0.8rem; }
    header a:hover { color: #888; }
    h1 { font-size: 1.4rem; font-weight: 800; color: var(--a); }
    .meta { font-size: 0.72rem; color: #333; margin-left: auto; font-family: monospace; }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.8rem; margin-bottom: 1.5rem; }
    .stat { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1rem 1.2rem; }
    .stat-val { font-size: 2rem; font-weight: 800; color: var(--a); letter-spacing: -1px; }
    .stat-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; color: #444; margin-top: 0.2rem; }

    .section { margin-bottom: 1.5rem; }
    .section-title { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: #444; margin-bottom: 0.6rem; padding-bottom: 0.4rem; border-bottom: 1px solid var(--border); }

    .alert-item { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2); border-radius: 10px; padding: 0.7rem 1rem; margin-bottom: 0.5rem; }
    .alert-header { font-size: 0.75rem; font-weight: 700; color: #ef4444; }
    .alert-text { font-size: 0.72rem; color: #888; margin-top: 0.2rem; line-height: 1.5; }
    .alert-meta { font-size: 0.62rem; color: #333; margin-top: 0.3rem; font-family: monospace; }

    table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
    th { text-align: left; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; color: #333; padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--border); }
    td { padding: 0.4rem 0.6rem; border-bottom: 1px solid rgba(255,255,255,0.03); color: #bbb; white-space: nowrap; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    .badge { display: inline-block; padding: 0.1rem 0.45rem; border-radius: 4px; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .badge-ap     { background: rgba(167,139,250,0.15); color: #a78bfa; }
    .badge-client { background: rgba(96,165,250,0.12); color: #60a5fa; }
    .badge-other  { background: rgba(255,255,255,0.05); color: #555; }
    .badge-unknown { background: rgba(251,191,36,0.12); color: #fbbf24; }

    .sig { font-family: monospace; }
    .sig-good  { color: #4ade80; }
    .sig-ok    { color: #facc15; }
    .sig-weak  { color: #f87171; }

    .crypt { font-size: 0.65rem; font-weight: 700; padding: 0.1rem 0.4rem; border-radius: 4px; white-space: nowrap; }
    .crypt-good { background: rgba(74,222,128,0.12); color: #4ade80; }
    .crypt-ok   { background: rgba(250,204,21,0.12); color: #facc15; }
    .crypt-bad  { background: rgba(248,113,113,0.15); color: #f87171; }

    .filter-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.8rem; flex-wrap: wrap; }
    .filter-btn { padding: 0.3rem 0.8rem; border-radius: 20px; border: 1px solid var(--border); background: var(--card); color: #555; font-size: 0.68rem; cursor: pointer; transition: all 0.2s; }
    .filter-btn.active { border-color: var(--a); color: var(--a); }
    input[type=search] { padding: 0.3rem 0.8rem; border-radius: 20px; border: 1px solid var(--border); background: var(--card); color: #ccc; font-size: 0.68rem; outline: none; width: 200px; }
    input[type=search]::placeholder { color: #333; }
    .stale-toggle { display: flex; align-items: center; gap: 0.4rem; font-size: 0.68rem; color: #555; margin-left: auto; cursor: pointer; user-select: none; }
    .stale-toggle input { accent-color: var(--a); }
    .row-count { font-size: 0.65rem; color: #333; margin-bottom: 0.5rem; }
  </style>
  <script src="/auth.js"></script>
</head>
<body>
<div class="bg" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="content">

  <header>
    <a href="/">← Home</a>
    <h1>📡 Wireless</h1>
    <div class="meta" id="meta">Loading…</div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="section" id="alerts-section" style="display:none">
    <div class="section-title" style="display:flex;align-items:center;justify-content:space-between">
      <span>🚨 Alerts</span>
      <button id="ack-alerts" class="filter-btn" style="text-transform:none;letter-spacing:normal">Acknowledge all</button>
    </div>
    <div id="alerts"></div>
  </div>

  <div class="section">
    <div class="section-title">Devices</div>
    <div class="filter-row">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="AP">APs</button>
      <button class="filter-btn" data-filter="Client">Clients</button>
      <button class="filter-btn" data-filter="unknown">Unknown</button>
      <input type="search" id="search" placeholder="Search MAC, SSID, vendor…">
      <label class="stale-toggle"><input type="checkbox" id="show-stale"> Show inactive (30m+)</label>
    </div>
    <div class="row-count" id="row-count"></div>
    <table>
      <thead>
        <tr>
          <th>Type</th><th>Host</th><th>MAC</th><th>SSID / Name</th><th>Vendor</th>
          <th>Security</th><th>Signal</th><th>Ch</th><th>Last seen</th><th>Probing for</th>
        </tr>
      </thead>
      <tbody id="devices"></tbody>
    </table>
  </div>

</div>
<script>
  const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ESC_MAP[c]);

  const STALE_SECONDS = 1800;

  let allDevices = [];
  let activeFilter = 'all';
  let lastAlertTs = 0;

  function sigClass(s) {
    if (!s || s === 0) return '';
    if (s >= -60) return 'sig-good';
    if (s >= -75) return 'sig-ok';
    return 'sig-weak';
  }

  function cryptClass(c) {
    if (!c) return '';
    if (/WEP|Open/i.test(c) && !/WPA/i.test(c)) return 'crypt-bad';
    if (/WPA3/i.test(c)) return 'crypt-good';
    return 'crypt-ok';
  }

  function relTime(ts) {
    if (!ts) return '—';
    const diff = Math.floor(Date.now()/1000) - ts;
    if (diff < 60) return `${diff}s ago`;
    if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
    return `${Math.floor(diff/86400)}d ago`;
  }

  function renderDevices() {
    const q = document.getElementById('search').value.toLowerCase();
    const showStale = document.getElementById('show-stale').checked;
    const now = Math.floor(Date.now()/1000);
    const tbody = document.getElementById('devices');
    const rows = allDevices.filter(d => {
      if (!showStale && (!d.last_time || now - d.last_time > STALE_SECONDS)) return false;
      if (activeFilter === 'AP' && !d.type.includes('AP')) return false;
      if (activeFilter === 'Client' && !d.type.includes('Client')) return false;
      if (activeFilter === 'unknown' && d.known) return false;
      if (q && ![d.mac, d.ssid, d.name, d.manuf, d.hostname, ...(d.probes||[])].join(' ').toLowerCase().includes(q)) return false;
      return true;
    });

    document.getElementById('row-count').textContent =
      `Showing ${rows.length} of ${allDevices.length} devices${showStale ? '' : ' (inactive 30m+ hidden)'}`;

    tbody.innerHTML = rows.map(d => {
      const isAP = d.type.includes('AP');
      const badge = isAP ? 'badge-ap' : d.type.includes('Client') ? 'badge-client' : 'badge-other';
      const label = isAP ? 'AP' : d.type.includes('Client') ? 'Client' : d.type;
      const unknownBadge = (!d.known && d.type.includes('Client')) ? ' <span class="badge badge-unknown">unknown</span>' : '';
      const ssid = d.ssid ? esc(d.ssid) : (isAP ? '<span style="color:#333">hidden</span>' : '—');
      const sig = d.signal ? `<span class="sig ${sigClass(d.signal)}">${d.signal} dBm</span>` : '—';
      const probes = (d.probes||[]).slice(0,3).map(esc).join(', ') || '—';
      const host = d.hostname ? `<span style="color:#ddd">${esc(d.hostname)}</span>` : '<span style="color:#333">—</span>';
      const crypt = d.crypt ? `<span class="crypt ${cryptClass(d.crypt)}">${esc(d.crypt.split(' ')[0])}</span>` : '<span style="color:#333">—</span>';
      return `<tr>
        <td><span class="badge ${badge}">${esc(label)}</span>${unknownBadge}</td>
        <td>${host}</td>
        <td style="font-family:monospace;color:#666">${esc(d.mac)}</td>
        <td>${ssid}</td>
        <td style="color:#555">${esc(d.manuf||'—')}</td>
        <td>${crypt}</td>
        <td>${sig}</td>
        <td style="color:#555">${d.channel||'—'}</td>
        <td style="color:#444">${relTime(d.last_time)}</td>
        <td style="color:#555;max-width:200px;overflow:hidden;text-overflow:ellipsis">${probes}</td>
      </tr>`;
    }).join('');
  }

  async function load() {
    const d = await fetch('/api/kismet').then(r => r.json());
    if (d.error) { document.getElementById('meta').textContent = d.error; return; }

    allDevices = (d.devices || []).slice().sort((a, b) => (b.last_time||0) - (a.last_time||0));
    const active  = allDevices.filter(x => x.last_time && (d.ts - x.last_time) <= STALE_SECONDS);
    const aps     = active.filter(x => x.type.includes('AP')).length;
    const clients = active.filter(x => x.type.includes('Client')).length;
    const unknown = active.filter(x => !x.known && x.type.includes('Client')).length;
    const allAlerts = d.alerts || [];
    const ackTs = Number(localStorage.getItem('kismet_alerts_ack_ts') || 0);
    const alerts = allAlerts.filter(a => a.ts > ackTs);
    lastAlertTs = allAlerts.reduce((m, a) => Math.max(m, a.ts), ackTs);

    document.getElementById('meta').textContent =
      `Updated ${relTime(d.ts)} · Kismet up ${Math.floor((d.uptime_sec||0)/60)}m · ${d.device_count} seen all-time`;

    document.getElementById('stats').innerHTML = [
      [active.length, 'Active (30m)'],
      [aps, 'Access points'],
      [clients, 'Clients'],
      [unknown, 'Unknown clients'],
      [alerts.length, 'Alerts'],
    ].map(([v,l]) => `<div class="stat"><div class="stat-val">${v}</div><div class="stat-label">${l}</div></div>`).join('');

    if (alerts.length) {
      const groups = new Map();
      alerts.forEach(a => {
        const normText = a.text.replace(/\(\d+ failures?\)/i, '').trim();
        const key = `${a.header}|${a.class}|${normText}`;
        const g = groups.get(key);
        if (!g || a.ts > g.ts) groups.set(key, { ...a, count: (g?.count||0) + 1, ts: g ? Math.max(g.ts, a.ts) : a.ts });
        else g.count++;
      });
      const grouped = [...groups.values()].sort((a,b) => b.ts - a.ts).slice(0, 8);

      document.getElementById('alerts-section').style.display = '';
      document.getElementById('alerts').innerHTML = grouped.map(a => `
        <div class="alert-item">
          <div class="alert-header">${esc(a.header)} <span style="font-weight:400;color:#555">[${esc(a.class)}]</span>${a.count > 1 ? ` <span style="font-weight:400;color:#888">×${a.count}</span>` : ''}</div>
          <div class="alert-text">${esc(a.text)}</div>
          <div class="alert-meta">${a.count > 1 ? 'last ' : ''}${new Date(a.ts*1000).toLocaleString()} ${a.source_mac ? '· ' + esc(a.source_mac) : ''}</div>
        </div>`).join('');
    } else {
      document.getElementById('alerts-section').style.display = 'none';
    }

    renderDevices();
  }

  document.querySelectorAll('.filter-row .filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-row .filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      renderDevices();
    });
  });
  document.getElementById('search').addEventListener('input', renderDevices);
  document.getElementById('show-stale').addEventListener('change', renderDevices);
  document.getElementById('ack-alerts').addEventListener('click', () => {
    localStorage.setItem('kismet_alerts_ack_ts', String(lastAlertTs));
    load();
  });

  load();
  setInterval(load, 30000);
</script>
</body>
</html>
