<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arr</title>
<style>
  :root {
    --chassis: #1c1e20;
    --panel: #26282b;
    --inset: #202224;
    --bezel: #38393c;
    --bezel-lit: #4a4c4f;
    --ink: #eae7df;
    --ink-dim: #9ea1a5;
    --ink-faint: #909398;
    --ok: #6fb98a;
    --warn: #d7a24a;
    --down: #c9584a;
    --copper: #b8875a;
    --font-plate: 'Bahnschrift', 'DIN Alternate', 'Arial Narrow', sans-serif;
    --font-mono: ui-monospace, 'Cascadia Mono', 'SF Mono', 'DejaVu Sans Mono', Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--chassis);
    background-image:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    color: var(--ink);
    font-family: var(--font-plate);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  header.topbar {
    display: flex; align-items: center; gap: 1.4rem;
    padding: 0.9rem 1.6rem;
    border-bottom: 1px solid var(--bezel);
    background: linear-gradient(180deg, #222426, #1e2022);
    position: sticky; top: 0; z-index: 50;
  }
  .home-link {
    font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-dim); text-decoration: none;
  }
  .home-link:hover { color: var(--ink); }
  .plate-name {
    font-weight: 700; font-size: 0.92rem; letter-spacing: 0.34em;
    color: var(--ink); text-transform: uppercase;
  }
  .status-led {
    margin-left: auto; display: flex; align-items: center; gap: 0.55rem;
    font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.08em;
    color: var(--ink-dim);
  }
  .lamp {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--ink-faint); display: inline-block;
    box-shadow: inset 0 1px 1px rgba(0,0,0,0.4); flex-shrink: 0;
  }
  .lamp.on   { background: var(--ok);   box-shadow: 0 0 8px 1px color-mix(in srgb, var(--ok) 70%, transparent); }
  .lamp.warn { background: var(--warn); box-shadow: 0 0 8px 1px color-mix(in srgb, var(--warn) 70%, transparent); }
  .lamp.down { background: var(--down); box-shadow: 0 0 9px 2px color-mix(in srgb, var(--down) 80%, transparent); animation: pulse-lamp 1.6s ease-in-out infinite; }
  @keyframes pulse-lamp { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }

  main.frame { max-width: 820px; margin: 0 auto; padding: 1.8rem 1.6rem 3rem; }

  .eyebrow {
    font-size: 0.64rem; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ink-dim); margin-bottom: 0.9rem;
  }

  section { margin-bottom: 2.1rem; }

  .manifest-card { background: var(--panel); border: 1px solid var(--bezel); border-radius: 6px; padding: 1.2rem 1.4rem; }

  .rows { font-family: var(--font-mono); font-size: 0.8rem; }
  .rows .row {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 0.6rem;
    padding: 0.55rem 0; border-bottom: 1px solid var(--inset);
  }
  .rows .row:last-child { border-bottom: none; }
  .svc-name { color: var(--ink); display: flex; align-items: center; gap: 0.6rem; text-transform: capitalize; }
  .svc-message { color: var(--ink-dim); text-align: right; }
  .row.is-down .svc-message { color: var(--down); }

  .dl-empty { font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink-faint); }
  .dl-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.4rem; }
  .dl-meta { font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-dim); }

  .advisory {
    font-family: var(--font-mono); font-size: 0.7rem; color: var(--warn);
    margin-bottom: 1.2rem;
  }

  footer.updated {
    max-width: 820px; margin: 0 auto; padding: 0 1.6rem 2rem;
    font-family: var(--font-mono); font-size: 0.62rem; color: var(--ink-faint); text-align: right;
  }
</style>
</head>
<body>

<header class="topbar">
  <a class="home-link" href="/">← HOME</a>
  <div class="plate-name">ARR STACK</div>
  <div class="status-led"><span class="lamp" id="status-lamp"></span><span id="status-text">READING…</span></div>
</header>

<main class="frame">

  <div class="advisory" id="stale-advisory" style="display:none">
    ⚠ Collector on wacky hasn't reported in a while — data below may be stale.
  </div>

  <section>
    <div class="eyebrow">LATEST DOWNLOAD</div>
    <div class="manifest-card" id="latest-download">
      <div class="dl-empty">—</div>
    </div>
  </section>

  <section>
    <div class="eyebrow">SERVICES — NOOB</div>
    <div class="manifest-card">
      <div class="rows" id="services"></div>
    </div>
  </section>

</main>

<footer class="updated" id="updated"></footer>

<script>
  const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ESC_MAP[c]);

  function fmtAgo(iso) {
    if (!iso) return '';
    const ts = new Date(iso).getTime();
    if (Number.isNaN(ts)) return '';
    const mins = Math.max(0, Math.round((Date.now() - ts) / 60000));
    if (mins < 1) return 'just now';
    if (mins < 60) return `${mins}m ago`;
    if (mins < 1440) return `${Math.round(mins / 60)}h ago`;
    return `${Math.round(mins / 1440)}d ago`;
  }

  function renderServices(services) {
    const box = document.getElementById('services');
    const entries = Object.entries(services || {});
    if (!entries.length) { box.innerHTML = '<div class="row"><span>—</span></div>'; return; }
    box.innerHTML = entries.map(([name, s]) => `
      <div class="row ${s.ok ? '' : 'is-down'}">
        <span class="svc-name"><span class="lamp ${s.ok ? 'on' : 'down'}"></span>${esc(name)}</span>
        <span class="svc-message">${esc(s.ok ? 'ok' : s.message)}</span>
      </div>`).join('');
  }

  function renderLatestDownload(dl) {
    const box = document.getElementById('latest-download');
    if (!dl) { box.innerHTML = '<div class="dl-empty">No imports recorded yet</div>'; return; }
    box.innerHTML = `
      <div class="dl-title">${esc(dl.title)}</div>
      <div class="dl-meta">${esc(dl.source)} · ${fmtAgo(dl.at)}</div>
    `;
  }

  async function load() {
    try {
      const r = await fetch('/api/arr');
      const d = await r.json();
      if (d.error) {
        document.getElementById('status-text').textContent = 'ERROR';
        document.getElementById('status-lamp').className = 'lamp down';
        renderServices({});
        renderLatestDownload(null);
        return;
      }

      const services = d.services || {};
      const down = Object.entries(services).filter(([, s]) => !s.ok);
      const lamp = document.getElementById('status-lamp');
      const statusText = document.getElementById('status-text');
      const lampCls = down.length ? 'down' : 'on';
      lamp.className = 'lamp ' + lampCls;
      statusText.textContent = down.length ? `${down.length} DOWN` : 'ALL OK';

      document.getElementById('stale-advisory').style.display = d.stale ? '' : 'none';

      renderServices(services);
      renderLatestDownload(d.latest_download);

      document.getElementById('updated').textContent = 'Updated ' + new Date(d.ts * 1000).toLocaleTimeString('en-GB');
    } catch (e) {
      document.getElementById('status-text').textContent = 'OFFLINE';
      document.getElementById('status-lamp').className = 'lamp down';
    }
  }

  load();
  setInterval(load, 15000);
</script>
</body>
</html>
