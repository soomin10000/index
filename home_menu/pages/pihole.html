<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pi-hole</title>
  <script src="/chart.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #020a18;
      font-family: 'DejaVu Sans Mono', 'Courier New', monospace;
      color: #4a8aaa;
      min-height: 100vh;
    }

    body::after {
      content: ''; position: fixed; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
      pointer-events: none; z-index: 100;
    }

    nav {
      display: flex; align-items: center; gap: 1rem;
      padding: 0.55rem 1.2rem;
      border-bottom: 1px solid #041828;
      background: rgba(2,10,24,0.95);
      backdrop-filter: blur(8px);
      position: sticky; top: 0; z-index: 50;
    }
    nav a { color: #5a9ab8; font-size: 0.68rem; text-decoration: none; letter-spacing: 0.12em; transition: color .2s; }
    nav a:hover { color: #00ffcc; }
    .brand { font-size: 0.78rem; font-weight: bold; letter-spacing: 0.25em; color: #5a8fb8; }
    #status { margin-left: auto; font-size: 0.62rem; color: #5a8fb8; letter-spacing: 0.08em; }

    .page { max-width: 1400px; margin: 0 auto; padding: 1.4rem 1.4rem 3rem; }

    /* Stat cards */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.9rem; margin-bottom: 1.6rem;
    }
    .stat-card {
      background: rgba(4,14,30,0.9);
      border: 1px solid #0a2a40;
      border-radius: 12px; padding: 1rem 1.2rem;
    }
    .stat-label { font-size: 0.58rem; letter-spacing: 0.14em; color: #5a8fb8; margin-bottom: 0.4rem; }
    .stat-val   { font-size: 2rem; font-weight: bold; letter-spacing: -1px; }
    .stat-sub   { font-size: 0.65rem; color: #5a8fb8; margin-top: 0.3rem; }
    .c-green  { color: #00cc88; }
    .c-red    { color: #ff4444; }
    .c-blue   { color: #00aaff; }
    .c-purple { color: #cc88ff; }
    .c-teal   { color: #00ffcc; }
    .gravity-btn {
      margin-top: 0.45rem; background: none; border: 1px solid #5a8fb8; color: #5a8fb8;
      font: inherit; font-size: 0.58rem; letter-spacing: 0.12em;
      padding: 0.25rem 0.6rem; border-radius: 3px; cursor: pointer;
    }
    .gravity-btn:hover:not(:disabled) { border-color: #00ffcc; color: #00ffcc; }
    .gravity-btn:disabled { opacity: 0.6; cursor: default; }

    /* Redundancy panel — two nodes + the sync relationship between them */
    .redund-eyebrow {
      font-size: 0.6rem; letter-spacing: 0.24em; color: #5a8fb8;
      margin-bottom: 0.6rem;
    }
    .redund-row {
      display: flex; align-items: stretch;
      background: rgba(4,14,30,0.9);
      border: 1px solid #0a2a40; border-radius: 12px;
      overflow: hidden; margin-bottom: 1.6rem;
    }
    .node-card { flex: 1 1 0; min-width: 0; padding: 1.1rem 1.3rem; }
    .node-card.is-down { opacity: 0.55; }
    .node-head { display: flex; align-items: center; gap: 0.55rem; margin-bottom: 0.55rem; }
    .node-role { font-size: 0.62rem; letter-spacing: 0.16em; color: #8fb8d8; font-weight: bold; }
    .node-role small { color: #5a8fb8; font-weight: normal; letter-spacing: 0.1em; }
    .node-host { font-size: 1.08rem; font-weight: bold; color: #cfe8ff; margin-bottom: 0.75rem; }
    .node-ip { font-size: 0.66rem; color: #5a8fb8; font-weight: normal; margin-left: 0.45rem; }
    .node-line {
      display: flex; justify-content: space-between; font-size: 0.68rem;
      padding: 0.24rem 0; color: #5a8fb8; border-top: 1px dashed rgba(90,143,184,0.15);
    }
    .node-line:first-of-type { border-top: none; }
    .node-line b { color: #cfe8ff; font-weight: bold; }
    .node-badge {
      display: inline-block; margin-top: 0.75rem; font-size: 0.55rem; letter-spacing: 0.1em;
      color: #00ffcc; border: 1px solid rgba(0,255,204,0.35); border-radius: 3px;
      padding: 0.2rem 0.5rem;
    }
    .node-down-msg { font-size: 0.68rem; color: #ff4444; padding: 0.5rem 0 0.2rem; }

    .node-lamp {
      width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
      background: #00cc88; box-shadow: 0 0 7px 1px #00cc88;
      animation: lamp-pulse 2.4s ease-in-out infinite;
    }
    .node-lamp.warn { background: #ffaa00; box-shadow: 0 0 7px 1px #ffaa00; }
    .node-lamp.down {
      background: #ff4444; box-shadow: 0 0 7px 1px #ff4444;
      animation: lamp-pulse 1s ease-in-out infinite;
    }
    @keyframes lamp-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    .rail {
      flex: 0 0 172px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.4rem; padding: 1rem 0.7rem; text-align: center;
      border-left: 1px solid #0a2a40; border-right: 1px solid #0a2a40;
      background: rgba(2,10,24,0.5);
    }
    .rail-track { width: 100%; height: 2px; background: rgba(90,143,184,0.18); position: relative; }
    .rail-dot {
      position: absolute; top: 50%; left: 0; width: 6px; height: 6px; margin-top: -3px;
      border-radius: 50%; background: #00ffcc; box-shadow: 0 0 8px 2px rgba(0,255,204,0.7);
      animation: rail-travel 3.6s linear infinite;
    }
    .rail.warn .rail-dot { background: #ffaa00; box-shadow: 0 0 8px 2px rgba(255,170,0,0.7); }
    .rail.down .rail-dot { animation: none; opacity: 0.3; background: #ff4444; box-shadow: none; left: 50%; }
    @keyframes rail-travel {
      0%   { left: 0%;   opacity: 0; }
      8%   { opacity: 1; }
      92%  { opacity: 1; }
      100% { left: 100%; opacity: 0; }
    }
    .rail-badge { font-size: 0.6rem; letter-spacing: 0.12em; font-weight: bold; color: #00ffcc; margin-top: 0.1rem; }
    .rail.warn .rail-badge { color: #ffaa00; }
    .rail.down .rail-badge { color: #ff4444; }
    .rail-sub { font-size: 0.54rem; color: #5a8fb8; line-height: 1.4; }

    @media (max-width: 760px) {
      .redund-row { flex-direction: column; }
      .rail { flex-basis: auto; border-left: none; border-right: none; border-top: 1px solid #0a2a40; border-bottom: 1px solid #0a2a40; }
    }
    @media (prefers-reduced-motion: reduce) {
      .node-lamp, .rail-dot { animation: none !important; opacity: 1; }
    }

    /* Chart cards */
    .chart-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem; margin-bottom: 1rem;
    }
    .chart-grid.wide { grid-template-columns: 1fr; }
    @media (max-width: 900px) { .chart-grid { grid-template-columns: 1fr; } }

    .chart-card {
      background: rgba(4,14,30,0.9);
      border: 1px solid #0a2a40;
      border-radius: 12px; padding: 1.1rem 1.2rem;
    }
    .chart-title {
      font-size: 0.62rem; letter-spacing: 0.14em; color: #5a8fb8;
      margin-bottom: 1rem;
    }
    .chart-wrap { position: relative; }
    canvas { display: block; }

    #updated { font-size: 0.6rem; color: #5583a3; margin-top: 1.2rem; text-align: right; }
  </style>
</head>
<body>

<nav>
  <a href="/">← HOME</a>
  <a href="/unifi">UNIFI</a>
  <a href="/cross_ref">CROSS-REF</a>
  <span class="brand">· PI-HOLE ·</span>
  <span id="status">LOADING...</span>
</nav>

<div class="page">
  <div class="redund-eyebrow">DNS REDUNDANCY</div>
  <div class="redund-row" id="redund"></div>

  <div class="stat-grid" id="stats"></div>

  <div class="chart-grid wide">
    <div class="chart-card">
      <div class="chart-title">QUERY HISTORY · LAST 24H (10-MIN BUCKETS)</div>
      <div class="chart-wrap"><canvas id="ch-history" height="110"></canvas></div>
    </div>
  </div>

  <div class="chart-grid">
    <div class="chart-card">
      <div class="chart-title">TOP CLIENTS</div>
      <div class="chart-wrap"><canvas id="ch-clients" height="220"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">TOP BLOCKED DOMAINS</div>
      <div class="chart-wrap"><canvas id="ch-blocked" height="220"></canvas></div>
    </div>
  </div>

  <div class="chart-grid">
    <div class="chart-card">
      <div class="chart-title">TOP QUERIED DOMAINS</div>
      <div class="chart-wrap"><canvas id="ch-domains" height="220"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">QUERY TYPE BREAKDOWN</div>
      <div class="chart-wrap"><canvas id="ch-types" height="220"></canvas></div>
    </div>
  </div>

  <div id="updated"></div>
</div>

<script>
const BG      = '#020a18';
const PANEL   = 'rgba(4,14,30,0.9)';
const GRID    = '#0a1e30';
const LABEL   = '#5a8fb8';
const TEAL    = '#00e5cc';
const RED     = '#ff4444';
const BLUE    = '#4e9af1';
const ORANGE  = '#f0a030';
const PURPLE  = '#cc88ff';
const GREEN   = '#00cc88';

Chart.defaults.color          = LABEL;
Chart.defaults.borderColor    = GRID;
Chart.defaults.font.family    = "'DejaVu Sans Mono', monospace";
Chart.defaults.font.size      = 11;

const baseOpts = {
  responsive: true,
  animation: { duration: 600 },
  plugins: { legend: { display: false }, tooltip: {
    backgroundColor: '#08182a',
    borderColor: '#1a4060', borderWidth: 1,
    titleColor: '#aaddff', bodyColor: '#5a9ab8',
    padding: 10,
  }},
  scales: {
    x: { grid: { color: GRID }, ticks: { color: LABEL } },
    y: { grid: { color: GRID }, ticks: { color: LABEL }, beginAtZero: true },
  },
};

function glow(color, alpha=0.12) { return color.replace('#', '#') + Math.round(alpha*255).toString(16).padStart(2,'0'); }

const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ESC_MAP[c]);

function fmtAge(ts) {
  if (!ts) return 'never';
  const h = (Date.now() / 1000 - ts) / 3600;
  if (h < 1)  return `${Math.max(1, Math.round(h * 60))}m ago`;
  if (h < 48) return `${h.toFixed(0)}h ago`;
  return `${(h / 24).toFixed(0)}d ago`;
}

// The redundancy story is the point of running a second Pi-hole at all, so it
// gets top billing: two nodes, and whether the hourly nebula-sync between them
// is actually keeping steve's gravity list current with bazza's.
function renderRedundancy(d) {
  const s   = d.summary;
  const sec = d.secondary || { reachable: false };

  const priG = s.gravity.domains || 0;
  const secG = sec.reachable ? (sec.summary.gravity.domains || 0) : 0;
  const driftPct = (sec.reachable && priG) ? Math.abs(priG - secG) / priG * 100 : null;
  const inSync = sec.reachable && driftPct !== null && driftPct < 2;

  const state   = !sec.reachable ? 'down' : inSync ? 'ok' : 'warn';
  const label   = !sec.reachable ? 'NO REDUNDANCY' : inSync ? 'IN SYNC' : 'DRIFT DETECTED';
  const railSub = !sec.reachable
    ? esc(sec.error || 'unreachable')
    : `gravity rebuilt ${fmtAge(sec.summary.gravity.last_update)}<br>nebula-sync · hourly`;

  const secBody = sec.reachable ? `
      <div class="node-line"><span>QUERIES TODAY</span><b>${sec.summary.total.toLocaleString()}</b></div>
      <div class="node-line"><span>BLOCKED</span><b class="c-red">${sec.summary.percent_blocked}%</b></div>
      <div class="node-line"><span>GRAVITY</span><b class="c-teal">${(secG / 1e6).toFixed(2)}M</b></div>
      <div class="node-line"><span>UPDATED</span><b>${fmtAge(sec.summary.gravity.last_update)}</b></div>
      <div class="node-badge">OWN LOCAL RESOLVER</div>
    ` : `<div class="node-down-msg">${esc(sec.error || 'Unreachable')}</div>`;

  document.getElementById('redund').innerHTML = `
    <div class="node-card">
      <div class="node-head"><span class="node-lamp ok"></span><span class="node-role">PRIMARY</span></div>
      <div class="node-host">bazza <span class="node-ip">192.168.1.246</span></div>
      <div class="node-line"><span>QUERIES TODAY</span><b>${s.total.toLocaleString()}</b></div>
      <div class="node-line"><span>BLOCKED</span><b class="c-red">${s.percent_blocked}%</b></div>
      <div class="node-line"><span>GRAVITY</span><b class="c-teal">${(priG / 1e6).toFixed(2)}M</b></div>
      <div class="node-line"><span>UPDATED</span><b>${fmtAge(s.gravity.last_update)}</b></div>
    </div>

    <div class="rail ${state}">
      <div class="rail-track"><div class="rail-dot"></div></div>
      <div class="rail-badge">${label}</div>
      <div class="rail-sub">${railSub}</div>
    </div>

    <div class="node-card ${sec.reachable ? '' : 'is-down'}">
      <div class="node-head">
        <span class="node-lamp ${state}"></span>
        <span class="node-role">SECONDARY <small>· FAILOVER</small></span>
      </div>
      <div class="node-host">steve <span class="node-ip">${sec.host || ''}</span></div>
      ${secBody}
    </div>
  `;
}

let charts = {};
function mkChart(id, type, data, opts={}) {
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(document.getElementById(id), {
    type, data,
    options: { ...baseOpts, ...opts },
  });
}

function hBar(labels, values, color) {
  return {
    type: 'bar',
    data: {
      labels,
      datasets: [{ data: values, backgroundColor: color + '33', borderColor: color,
                   borderWidth: 1, borderRadius: 4 }],
    },
    options: {
      ...baseOpts,
      indexAxis: 'y',
      scales: {
        x: { grid: { color: GRID }, ticks: { color: LABEL } },
        y: { grid: { color: GRID }, ticks: { color: LABEL, font: { size: 10 } } },
      },
    },
  };
}

async function load() {
  const r = await fetch('/api/pihole?t=' + Date.now());
  const d = await r.json();
  const s = d.summary;

  renderRedundancy(d);

  // Stat cards
  const cacheRate = s.total ? ((s.cached / s.total) * 100).toFixed(1) : 0;
  const g = s.gravity || {};
  const gAgeH = g.last_update ? (Date.now() / 1000 - g.last_update) / 3600 : null;
  const gAge = gAgeH === null ? 'never'
             : gAgeH < 48 ? `${gAgeH.toFixed(0)}h ago`
             : `${(gAgeH / 24).toFixed(0)}d ago`;
  // weekly cron cadence: quiet under 8 days, amber to 14, then red
  const gAgeColor = gAgeH === null || gAgeH > 14 * 24 ? '#ff4444'
                  : gAgeH > 8 * 24 ? '#ffaa00' : '#5a8fb8';
  document.getElementById('stats').innerHTML = `
    <div class="stat-card">
      <div class="stat-label">TOTAL QUERIES</div>
      <div class="stat-val c-blue">${s.total.toLocaleString()}</div>
      <div class="stat-sub">${s.frequency.toFixed(2)} q/s</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">BLOCKED</div>
      <div class="stat-val c-red">${s.percent_blocked}%</div>
      <div class="stat-sub">${s.blocked.toLocaleString()} queries</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">CACHED</div>
      <div class="stat-val c-green">${cacheRate}%</div>
      <div class="stat-sub">${s.cached.toLocaleString()} queries</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">UNIQUE DOMAINS</div>
      <div class="stat-val c-teal">${s.unique_domains.toLocaleString()}</div>
      <div class="stat-sub">seen</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">FORWARDED</div>
      <div class="stat-val c-purple">${s.forwarded.toLocaleString()}</div>
      <div class="stat-sub">to upstream DNS</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">GRAVITY</div>
      <div class="stat-val c-teal">${((g.domains || 0) / 1e6).toFixed(2)}M</div>
      <div class="stat-sub" style="color:${gAgeColor}">domains · updated ${gAge}</div>
      <button class="gravity-btn" onclick="updateGravity(this)"
              ${gravityBusy ? 'disabled' : ''}>${gravityMsg}</button>
    </div>
  `;
  document.getElementById('status').textContent =
    `${s.percent_blocked}% BLOCKED · ${s.total.toLocaleString()} QUERIES`;

  // History chart
  const hist = d.history;
  const labels = hist.map(h => {
    const dt = new Date(h.timestamp * 1000);
    return dt.getHours().toString().padStart(2,'0') + ':' + dt.getMinutes().toString().padStart(2,'0');
  });
  // Show every ~2h label
  const sparseLabels = labels.map((l, i) => i % 12 === 0 ? l : '');

  mkChart('ch-history', 'line', {
    labels: sparseLabels,
    datasets: [
      {
        label: 'Total', data: hist.map(h => h.total),
        borderColor: BLUE, backgroundColor: BLUE + '15',
        borderWidth: 1.5, fill: true, tension: 0.3, pointRadius: 0,
      },
      {
        label: 'Cached', data: hist.map(h => h.cached),
        borderColor: GREEN, backgroundColor: GREEN + '10',
        borderWidth: 1.2, fill: true, tension: 0.3, pointRadius: 0,
      },
      {
        label: 'Blocked', data: hist.map(h => h.blocked),
        borderColor: RED, backgroundColor: RED + '18',
        borderWidth: 1.5, fill: true, tension: 0.3, pointRadius: 0,
      },
      {
        label: 'Forwarded', data: hist.map(h => h.forwarded),
        borderColor: ORANGE, backgroundColor: ORANGE + '10',
        borderWidth: 1, fill: false, tension: 0.3, pointRadius: 0,
      },
    ],
  }, { plugins: { legend: { display: true, labels: { color: LABEL, boxWidth: 12, padding: 16 } } } });

  // Top clients
  const cl = d.top_clients;
  const clChart = hBar(
    cl.map(c => c.name || c.ip),
    cl.map(c => c.count),
    TEAL
  );
  mkChart('ch-clients', 'bar', clChart.data, clChart.options);

  // Top blocked
  const bl = d.top_blocked;
  const blChart = hBar(
    bl.map(b => b.domain.length > 32 ? '…' + b.domain.slice(-30) : b.domain),
    bl.map(b => b.count),
    RED
  );
  mkChart('ch-blocked', 'bar', blChart.data, blChart.options);

  // Top domains
  const td = d.top_domains;
  const tdChart = hBar(
    td.map(b => b.domain.length > 32 ? '…' + b.domain.slice(-30) : b.domain),
    td.map(b => b.count),
    BLUE
  );
  mkChart('ch-domains', 'bar', tdChart.data, tdChart.options);

  // Query types — only non-zero
  const types = Object.entries(s.types).filter(([,v]) => v > 0).sort((a,b) => b[1]-a[1]);
  const typeColors = [TEAL, BLUE, ORANGE, PURPLE, GREEN, RED, '#f7dc6f', '#4ecdc4'];
  mkChart('ch-types', 'doughnut', {
    labels: types.map(([k]) => k),
    datasets: [{
      data: types.map(([,v]) => v),
      backgroundColor: typeColors.map(c => c + 'aa'),
      borderColor:     typeColors,
      borderWidth: 1,
    }],
  }, {
    plugins: {
      legend: { display: true, position: 'right', labels: { color: LABEL, boxWidth: 12, padding: 10 } },
      tooltip: baseOpts.plugins.tooltip,
    },
    scales: {},
  });

  const ts = new Date(d.ts * 1000).toLocaleTimeString('en-GB');
  document.getElementById('updated').textContent = `Last updated: ${ts}`;
}

// Button label/state survive the 60s re-render of the stat cards
let gravityMsg = 'UPDATE NOW';
let gravityBusy = false;

async function updateGravity(btn) {
  gravityBusy = true;
  gravityMsg = 'STARTING…';
  btn.disabled = true; btn.textContent = gravityMsg;
  try {
    const r = await fetch('/api/pihole/gravity', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}',
    });
    const j = await r.json();
    if (j.ok) {
      gravityMsg = 'RUNNING — TAKES A FEW MIN';
    } else {
      gravityMsg = 'FAILED'; gravityBusy = false;
      alert('Gravity update failed: ' + (j.error || r.status));
    }
  } catch (e) {
    gravityMsg = 'FAILED'; gravityBusy = false;
  }
  btn.disabled = gravityBusy; btn.textContent = gravityMsg;
}

load().catch(e => {
  document.getElementById('status').textContent = 'ERROR: ' + e.message;
});
setInterval(load, 60000);
</script>
</body>
</html>
