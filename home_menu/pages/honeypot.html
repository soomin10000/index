<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Honeypot</title>
<style>
  :root {
    --chassis: #1c1e20;
    --panel: #26282b;
    --inset: #202224;
    --bezel: #38393c;
    --ink: #eae7df;
    --ink-dim: #9ea1a5;
    --ink-faint: #909398;
    --armed: #d99a3f;   /* set and waiting */
    --sprung: #cf5a49;  /* something's inside */
    --font-plate: 'Bahnschrift', 'DIN Alternate', 'Arial Narrow', sans-serif;
    --font-mono: ui-monospace, 'Cascadia Mono', 'SF Mono', 'DejaVu Sans Mono', Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }

  body {
    background: var(--chassis);
    color: var(--ink);
    font-family: var(--font-plate);
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--armed); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  /* ── topbar ── */
  .topbar {
    display: flex; align-items: baseline; gap: 1.3rem;
    padding: 0.9rem 1.5rem;
    background: #1e2022;
  }
  .back {
    font-size: 0.72rem; letter-spacing: 0.06em;
    color: var(--ink-faint); text-decoration: none;
  }
  .back:hover { color: var(--ink); }
  .mark {
    font-weight: 700; font-size: 0.86rem; letter-spacing: 0.36em;
    text-transform: uppercase;
  }
  .state {
    margin-left: auto; align-self: center;
    display: flex; align-items: center; gap: 0.5rem;
    font-size: 0.74rem; color: var(--ink-dim);
  }
  .bead {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ink-faint); flex-shrink: 0;
  }
  body.is-armed  .bead { background: var(--armed);  box-shadow: 0 0 8px 1px color-mix(in srgb, var(--armed) 65%, transparent); }
  body.is-sprung .bead { background: var(--sprung); box-shadow: 0 0 10px 2px color-mix(in srgb, var(--sprung) 75%, transparent); animation: throb 1.5s ease-in-out infinite; }
  @keyframes throb { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* the tripwire: one line whose colour is the whole story */
  .wire { height: 2px; background: var(--bezel); transition: background 0.5s ease; }
  body.is-armed  .wire { background: var(--armed); }
  body.is-sprung .wire { background: var(--sprung); }

  main { max-width: 34rem; margin: 0 auto; padding: 2.4rem 1.5rem 3rem; }

  /* ── hero: the catch ── */
  .hero { min-height: 6rem; }
  .hero-wait { color: var(--ink-faint); }
  .hero-head {
    font-size: 1.55rem; font-weight: 700; line-height: 1.15;
    letter-spacing: 0.005em;
  }
  body.is-sprung .hero-head { color: var(--sprung); }
  .hero-id {
    font-family: var(--font-mono); font-size: 1.9rem; font-weight: 600;
    margin-top: 1rem; word-break: break-all;
  }
  .hero-line { color: var(--ink-dim); margin-top: 0.5rem; }
  .hero-line .said {
    font-family: var(--font-mono); color: var(--ink);
    background: color-mix(in srgb, var(--armed) 16%, transparent);
    padding: 0.05em 0.35em; border-radius: 3px;
  }
  body.is-sprung .hero-line .said { background: color-mix(in srgb, var(--sprung) 20%, transparent); }
  .hero-when { font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink-faint); margin-top: 0.7rem; }
  .flash { animation: flash 1.1s ease-out; }
  @keyframes flash {
    0% { background: color-mix(in srgb, var(--sprung) 26%, transparent); }
    100% { background: transparent; }
  }

  hr { border: 0; border-top: 1px solid var(--bezel); margin: 2rem 0; }

  /* ── summary sentence ── */
  .tally { font-size: 1.05rem; }
  .tally b { font-weight: 700; }

  /* ── service split ── */
  .split { margin-top: 1.3rem; display: grid; gap: 0.55rem; }
  .split-row {
    display: grid; grid-template-columns: 4rem 1fr 1.6rem; align-items: center; gap: 0.8rem;
    font-family: var(--font-mono); font-size: 0.8rem;
  }
  .split-row .svc { color: var(--ink); }
  .split-row .meter { height: 6px; border-radius: 3px; background: var(--inset); overflow: hidden; }
  .split-row .meter i { display: block; height: 100%; background: var(--armed); }
  .split-row .cnt { text-align: right; color: var(--ink-dim); }

  /* ── the log ── */
  .log-lead { font-size: 0.8rem; color: var(--ink-faint); margin-bottom: 0.8rem; }
  .log { font-family: var(--font-mono); font-size: 0.78rem; }
  .log-row {
    display: grid; grid-template-columns: 4.6rem 1fr; gap: 0.9rem;
    padding: 0.5rem 0; border-top: 1px solid var(--inset);
  }
  .log-row:first-child { border-top: 0; }
  .log-row.hit { color: var(--sprung); }
  .log-t { color: var(--ink-faint); }
  .log-what b { color: var(--ink); font-weight: 600; }
  .log-what .cred { color: var(--armed); }
  .log-row.hit .log-what b { color: var(--sprung); }

  .void { color: var(--ink-faint); font-size: 0.85rem; }

  footer {
    max-width: 34rem; margin: 0 auto; padding: 0 1.5rem 2.5rem;
    font-size: 0.8rem; color: var(--ink-faint);
  }
</style>
  <script src="/auth.js"></script>
</head>
<body>

<div class="topbar" id="topbar">
  <a class="back" href="/">← home</a>
  <span class="mark">Honeypot</span>
  <span class="state"><span class="bead"></span><span id="state-label">reading…</span></span>
</div>
<div class="wire" id="wire"></div>

<main>
  <section class="hero" id="hero"><p class="hero-wait">Reading the log…</p></section>

  <div id="body" hidden>
    <hr id="hr-tally">
    <p class="tally" id="tally"></p>
    <div class="split" id="split"></div>

    <hr id="hr-log">
    <p class="log-lead" id="log-lead">Everything it has seen today</p>
    <div class="log" id="log"></div>
  </div>
</main>

<footer id="footer"></footer>

<script>
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ESC[c]);

  const A = document.getElementById.bind(document);
  let lastSeenTs = null;

  const ago = s => {
    if (s == null) return '';
    s = Math.max(0, Math.round(s));
    if (s < 60) return s + ' seconds ago';
    if (s < 5400) { const m = Math.round(s / 60); return m + (m === 1 ? ' minute ago' : ' minutes ago'); }
    if (s < 172800) { const h = Math.round(s / 3600); return h + (h === 1 ? ' hour ago' : ' hours ago'); }
    return Math.round(s / 86400) + ' days ago';
  };
  const clock = ts => new Date(ts * 1000).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  // "tried telnet with test / test" | "knocked on ssh"
  function phrase(e) {
    const verb = e.login ? 'tried' : 'knocked on';
    if (e.login && (e.user || e.pw))
      return `${verb} ${esc(e.service)} with <span class="said">${esc(e.user || '∅')} / ${esc(e.pw || '∅')}</span>`;
    if (e.service === 'http' && e.ua)
      return `hit ${esc(e.service)} as <span class="said">${esc(e.ua)}</span>`;
    return `${verb} ${esc(e.service)}`;
  }

  function setState(mode, label) {
    document.body.className = mode;
    A('state-label').textContent = label;
  }

  function renderHero(d) {
    const hero = A('hero');
    const hit = (d.recent || []).find(e => e.login && (e.user || e.pw));
    const last = (d.recent || [])[0];

    if (d.error) {
      setState('is-sprung', 'blind');
      hero.innerHTML = `
        <div class="hero-head">Can't see the trap</div>
        <p class="hero-line">The poller on steve couldn't read weeny's log. ${esc(d.error)}</p>`;
      return;
    }

    if (!last) {
      setState('is-armed', 'armed');
      hero.innerHTML = `
        <div class="hero-head">The trap is set</div>
        <div class="hero-id">weeny · 192.168.1.5</div>
        <p class="hero-line">Nothing has touched it in 24 hours. No one has a reason to — so anything that does is worth a look.</p>`;
      return;
    }

    const now = Date.now() / 1000;
    const secsSince = e => e && e.ts ? now - e.ts : (d.last_age ?? null);
    const lastRecent = secsSince(last) != null && secsSince(last) < 3600;
    const hitRecent = hit && now - hit.ts < 3600;
    const subject = hitRecent ? hit : last;

    setState(hitRecent ? 'is-sprung' : 'is-armed',
      hitRecent ? 'caught a login' : lastRecent ? 'being probed' : 'armed');

    hero.innerHTML = `
      <div class="hero-head">${subject.login ? 'Someone tried to log in' : 'Someone knocked'}</div>
      <div class="hero-id">${esc(subject.src)}</div>
      <p class="hero-line">${phrase(subject)}</p>
      <p class="hero-when">${clock(subject.ts)} · ${ago(secsSince(subject))}</p>`;

    if (lastSeenTs !== null && subject.ts > lastSeenTs) {
      A('hero').classList.remove('flash'); void A('hero').offsetWidth; A('hero').classList.add('flash');
    }
    lastSeenTs = subject.ts;
  }

  function renderTally(d) {
    const n = d.attempts_24h || 0, src = d.sources_24h || 0;
    const show = n > 0;
    A('hr-tally').hidden = !show;
    A('tally').hidden = !show;
    if (!show) return;
    const h = n === 1 ? '1 hit' : `${n} hits`;
    const s = src === 1 ? '1 address' : `${src} addresses`;
    const l = d.logins_24h ? `, ${d.logins_24h === 1 ? '1 of them a login attempt' : d.logins_24h + ' of them login attempts'}` : '';
    A('tally').innerHTML = `<b>${h}</b> from <b>${s}</b> in the last 24 hours${l}.`;
  }

  function renderSplit(d) {
    const box = A('split');
    const rows = Object.entries(d.by_service || {}).sort((a, b) => b[1] - a[1]);
    box.hidden = rows.length < 2;   // one service tells you nothing extra
    if (box.hidden) return;
    const max = Math.max(...rows.map(r => r[1]));
    box.innerHTML = rows.map(([svc, c]) => `
      <div class="split-row">
        <span class="svc">${esc(svc)}</span>
        <span class="meter"><i style="width:${Math.round(c / max * 100)}%"></i></span>
        <span class="cnt">${c}</span>
      </div>`).join('');
  }

  // one flat log line: 10:26:53   192.168.1.170   telnet login   test / test
  function logLine(e) {
    const act = e.login ? 'login' : 'connect';
    const cred = (e.user || e.pw) ? ` <span class="cred">${esc(e.user || '∅')} / ${esc(e.pw || '∅')}</span>` : '';
    return `${esc(e.src)}&nbsp;&nbsp;<b>${esc(e.service)} ${act}</b>${cred}`;
  }

  function renderLog(d) {
    const list = d.recent || [];
    const show = list.length > 0;
    A('hr-log').hidden = !show;
    A('log-lead').hidden = !show;
    A('log').hidden = !show;
    if (!show) return;
    A('log').innerHTML = list.map(e => `
      <div class="log-row ${e.login && (e.user || e.pw) ? 'hit' : ''}">
        <span class="log-t">${clock(e.ts)}</span>
        <span class="log-what">${logLine(e)}</span>
      </div>`).join('');
  }

  function renderFooter(d) {
    const t = d.ts ? new Date(d.ts * 1000).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : '—';
    A('footer').textContent =
      `weeny is a decoy posing as a small NAS — FTP, telnet, HTTP and SSH are baited and nothing behind them is real. Updated ${t}.`;
  }

  function render(d) {
    renderHero(d);
    A('body').hidden = !!d.error;
    if (!d.error) { renderTally(d); renderSplit(d); renderLog(d); }
    renderFooter(d);
  }

  async function load() {
    try {
      const r = await fetch('/api/honeypot');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      render(await r.json());
    } catch (e) {
      setState('is-sprung', 'offline');
      A('hero').innerHTML = `
        <div class="hero-head">Status page can't reach the dashboard</div>
        <p class="hero-line">Retrying every 15 seconds.</p>`;
      A('body').hidden = true;
      A('footer').textContent = '';
    }
  }

  load();
  setInterval(load, 15000);
</script>
</body>
</html>
