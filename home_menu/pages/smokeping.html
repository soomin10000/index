<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmokePing — Latency Observatory</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --soot:   #161210;
      --panel:  #211a14;
      --line:   #3a2f24;
      --line-lit: #55432f;
      --ink:    #ede4d3;
      --dim:    #a8998a;
      --faint:  #75685a;
      --ember:  #e8834a;
      --ember-dim: #a05a33;
      --loss:   #c9584a;
      /* cool signal color for the median line — it has to read as the one
         real measurement cutting through the warm ember smoke, not blend
         into it; same value the old PNG plate remap used for this line */
      --signal: #7af096;
      --font-mono: ui-monospace, 'Cascadia Mono', 'DejaVu Sans Mono', Consolas, monospace;
      --font-plate: 'Bahnschrift', 'DIN Alternate', 'Arial Narrow', sans-serif;
    }

    body {
      background: var(--soot);
      background-image: radial-gradient(ellipse 120% 60% at 50% -10%, rgba(232,131,74,0.05), transparent 60%);
      color: var(--ink);
      font-family: var(--font-mono);
      min-height: 100vh;
    }

    a { color: inherit; }

    /* ── Sticky chrome: nav + toolbar ── */
    .chrome {
      position: sticky; top: 0; z-index: 40;
      background: rgba(22,18,16,0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    nav {
      display: flex; align-items: baseline; gap: 1.1rem; flex-wrap: wrap;
      padding: 0.6rem 1.3rem 0.5rem;
    }
    nav .home {
      font-size: 0.66rem; letter-spacing: 0.14em; text-decoration: none;
      color: var(--dim); transition: color .2s;
    }
    nav .home:hover { color: var(--ember); }
    .wordmark {
      font-family: var(--font-plate);
      font-size: 0.95rem; font-weight: 700;
      letter-spacing: 0.38em; text-transform: uppercase;
    }
    .wordmark em { font-style: normal; color: var(--ember); }
    #status {
      margin-left: auto; font-size: 0.62rem; color: var(--dim);
      letter-spacing: 0.06em; display: flex; align-items: baseline; gap: 0.9rem;
    }
    #status a { color: var(--faint); text-decoration: none; }
    #status a:hover { color: var(--ember); }
    .live-dot {
      display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      background: var(--faint); margin-right: 0.35rem; vertical-align: 6%;
    }
    .live-dot.up   { background: #7fb98a; box-shadow: 0 0 6px rgba(127,185,138,0.7); }
    .live-dot.down { background: #c9584a; box-shadow: 0 0 6px rgba(201,88,74,0.7); }

    .toolbar {
      display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
      padding: 0.5rem 1.3rem 0.6rem;
      border-top: 1px solid rgba(58,47,36,0.5);
    }
    .ranges { display: flex; gap: 0.3rem; }
    .range-btn {
      font-family: var(--font-mono); font-size: 0.64rem; letter-spacing: 0.08em;
      color: var(--dim); background: transparent;
      border: 1px solid var(--line); border-radius: 4px;
      padding: 0.28rem 0.65rem; cursor: pointer;
      transition: color .15s, border-color .15s, background .15s;
    }
    .range-btn:hover { border-color: var(--line-lit); color: var(--ink); }
    .range-btn.active {
      color: var(--soot); background: var(--ember); border-color: var(--ember);
      font-weight: 700;
    }
    #filter {
      font-family: var(--font-mono); font-size: 0.66rem;
      color: var(--ink); background: var(--panel);
      border: 1px solid var(--line); border-radius: 4px;
      padding: 0.3rem 0.6rem; width: 12.5rem; max-width: 40vw;
    }
    #filter::placeholder { color: var(--faint); }
    #filter:focus { outline: none; border-color: var(--ember-dim); }
    .toolbar .spacer { flex: 1; }
    #refreshed { font-size: 0.6rem; color: var(--faint); letter-spacing: 0.06em; }

    button:focus-visible, a:focus-visible, input:focus-visible, .tile:focus-visible {
      outline: 2px solid var(--ember); outline-offset: 2px;
    }

    /* ── Header ── */
    header { position: relative; overflow: hidden; text-align: center; padding: 2.2rem 1.3rem 1.6rem; }
    header h1 {
      font-family: var(--font-plate);
      font-size: clamp(1.7rem, 5vw, 2.6rem); font-weight: 700;
      letter-spacing: 0.45em; text-transform: uppercase;
      text-indent: 0.45em; /* balance the tracking */
    }
    header h1 em { font-style: normal; color: var(--ember); }
    header .sub {
      margin-top: 0.5rem; font-size: 0.63rem; color: var(--dim); letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    header .sub b { color: var(--ink); font-weight: 400; }

    /* Smoke wisps — the page's one flourish */
    .wisp {
      position: absolute; bottom: -40px; left: 50%;
      width: 90px; height: 220px; border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(237,228,211,0.05), transparent 70%);
      filter: blur(9px); pointer-events: none;
      animation: rise 9s ease-in-out infinite;
      opacity: 0;
    }
    .wisp:nth-child(2) { margin-left: -130px; animation-delay: 3s;   animation-duration: 11s; }
    .wisp:nth-child(3) { margin-left:   90px; animation-delay: 5.5s; animation-duration: 13s; }
    @keyframes rise {
      0%   { transform: translate(-50%, 30%) scaleX(1);   opacity: 0; }
      25%  { opacity: 0.9; }
      100% { transform: translate(-46%, -95%) scaleX(1.7); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .wisp { animation: none; opacity: 0; }
      * { transition: none !important; }
    }

    /* ── Notices ── */
    .notice {
      max-width: 1240px; margin: 0 auto 1rem; padding: 0.7rem 1rem;
      border: 1px solid #7a3d33; border-radius: 6px;
      background: rgba(201,88,74,0.08);
      font-size: 0.68rem; color: #d9a196; line-height: 1.5;
    }
    .notice b { color: #eec2b8; }

    /* ── Sections ── */
    .page { max-width: 1240px; margin: 0 auto; padding: 0 1.3rem 3.5rem; }
    section { margin-bottom: 2rem; }
    .sec-head {
      display: flex; align-items: baseline; gap: 0.8rem;
      margin: 1.6rem 0 0.75rem;
    }
    .sec-name {
      font-family: var(--font-plate); font-size: 0.82rem; font-weight: 700;
      letter-spacing: 0.3em; text-transform: uppercase; color: var(--ink);
    }
    .sec-count { font-size: 0.6rem; color: var(--faint); letter-spacing: 0.1em; }
    .sec-rule { flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 355px), 1fr));
      gap: 0.9rem;
    }

    /* ── Graph tiles ── */
    .tile {
      background: var(--panel);
      border: 1px solid var(--line); border-radius: 8px;
      overflow: hidden; cursor: zoom-in;
      transition: border-color .2s, transform .2s, box-shadow .2s;
    }
    .tile:hover {
      border-color: var(--ember-dim);
      transform: translateY(-2px);
      box-shadow: 0 8px 26px rgba(0,0,0,0.45);
    }
    .tile-cap {
      display: flex; align-items: baseline; gap: 0.6rem;
      padding: 0.5rem 0.75rem 0.45rem;
      border-bottom: 1px solid rgba(58,47,36,0.6);
    }
    .tile-name { font-size: 0.72rem; color: var(--ink); letter-spacing: 0.04em; }
    .tile-id   { font-size: 0.56rem; color: var(--faint); letter-spacing: 0.05em;
                 margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .shot { display: block; width: 100%; aspect-ratio: 697 / 310; background: #14100c; position: relative; }
    .shot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .shot.broken::after {
      content: 'no data yet'; position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.62rem; color: var(--faint); letter-spacing: 0.12em;
    }
    .shot.broken canvas { display: none; }
    .tile-stats {
      display: flex; gap: 0.9rem; padding: 0.4rem 0.75rem 0.55rem;
      font-size: 0.6rem; color: var(--dim); letter-spacing: 0.03em;
    }
    .tile-stats b { color: var(--ink); font-weight: 400; }
    .tile-stats .loss.warn { color: var(--loss); }

    .hidden { display: none !important; }

    #empty {
      text-align: center; color: var(--dim); font-size: 0.7rem;
      padding: 3rem 1rem; line-height: 1.8;
    }

    /* ── Lightbox ── */
    #box {
      position: fixed; inset: 0; z-index: 60;
      background: rgba(10,8,6,0.9); backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center;
      padding: 1.2rem;
    }
    #box.open { display: flex; }
    .box-card {
      background: var(--panel); border: 1px solid var(--line-lit); border-radius: 10px;
      max-width: min(96vw, 1000px); width: 100%;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6);
      overflow: hidden;
    }
    .box-head {
      display: flex; align-items: center; gap: 0.9rem; flex-wrap: wrap;
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--line);
    }
    .box-title { font-size: 0.8rem; letter-spacing: 0.05em; }
    .box-id { font-size: 0.6rem; color: var(--faint); }
    .box-head .spacer { flex: 1; }
    .box-head a { font-size: 0.62rem; color: var(--dim); text-decoration: none; }
    .box-head a:hover { color: var(--ember); }
    .box-close {
      font-family: var(--font-mono); font-size: 0.8rem; color: var(--dim);
      background: none; border: 1px solid var(--line); border-radius: 4px;
      width: 1.7rem; height: 1.7rem; cursor: pointer;
    }
    .box-close:hover { color: var(--ink); border-color: var(--line-lit); }
    .box-shot { background: #14100c; position: relative; aspect-ratio: 697 / 310; }
    .box-shot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .box-stats {
      display: flex; gap: 1.4rem; padding: 0.6rem 1rem;
      border-top: 1px solid rgba(58,47,36,0.6);
      font-size: 0.64rem; color: var(--dim); letter-spacing: 0.03em;
    }
    .box-stats b { color: var(--ink); font-weight: 400; }
    .box-stats .loss.warn { color: var(--loss); }
    .box-foot {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.6rem 1rem;
      border-top: 1px solid var(--line);
    }
    .box-nav {
      font-family: var(--font-mono); font-size: 0.64rem; color: var(--dim);
      background: none; border: 1px solid var(--line); border-radius: 4px;
      padding: 0.28rem 0.7rem; cursor: pointer;
    }
    .box-nav:hover { color: var(--ink); border-color: var(--line-lit); }
    .box-foot .spacer { flex: 1; }

    footer {
      text-align: center; font-size: 0.58rem; color: var(--faint);
      letter-spacing: 0.15em; padding: 0 1rem 2rem;
    }

    @media (max-width: 640px) {
      nav { gap: 0.7rem; }
      #status { margin-left: 0; flex-basis: 100%; }
      #filter { width: 100%; max-width: none; }
      .toolbar .spacer { display: none; }
    }
  </style>
</head>
<body>

<div class="chrome">
  <nav>
    <a class="home" href="/">&larr; HOME</a>
    <span class="wordmark">Smoke<em>ping</em></span>
    <span id="status"><span><span class="live-dot" id="dot"></span><span id="stat-text">loading…</span></span><a id="raw-link" href="#" target="_blank" rel="noopener">raw ui &nearr;</a></span>
  </nav>
  <div class="toolbar">
    <div class="ranges" id="ranges" role="group" aria-label="Time range">
      <button class="range-btn" data-r="3h">3 h</button>
      <button class="range-btn" data-r="30h">30 h</button>
      <button class="range-btn" data-r="10d">10 d</button>
      <button class="range-btn" data-r="1y">1 y</button>
    </div>
    <input id="filter" type="search" placeholder="filter targets…" aria-label="Filter targets">
    <span class="spacer"></span>
    <span id="refreshed"></span>
  </div>
</div>

<header>
  <div class="wisp" aria-hidden="true"></div>
  <div class="wisp" aria-hidden="true"></div>
  <div class="wisp" aria-hidden="true"></div>
  <h1>Latency <em>Observatory</em></h1>
  <div class="sub" id="sub-line">reading the smoke…</div>
</header>

<div class="page">
  <div id="notice" class="notice hidden"></div>
  <div id="sections"></div>
  <div id="empty" class="hidden"></div>
</div>

<div id="box" role="dialog" aria-modal="true" aria-label="Graph detail">
  <div class="box-card">
    <div class="box-head">
      <span class="box-title" id="box-title"></span>
      <span class="box-id" id="box-id"></span>
      <span class="spacer"></span>
      <a id="box-raw" href="#" target="_blank" rel="noopener">open in smokeping &nearr;</a>
      <button class="box-close" id="box-close" aria-label="Close">&times;</button>
    </div>
    <div class="box-shot"><canvas id="box-canvas"></canvas></div>
    <div class="box-stats" id="box-stats"></div>
    <div class="box-foot">
      <button class="box-nav" id="box-prev">&larr; prev</button>
      <button class="box-nav" id="box-next">next &rarr;</button>
      <span class="spacer"></span>
      <div class="ranges" id="box-ranges" role="group" aria-label="Lightbox time range">
        <button class="range-btn" data-r="3h">3 h</button>
        <button class="range-btn" data-r="30h">30 h</button>
        <button class="range-btn" data-r="10d">10 d</button>
        <button class="range-btn" data-r="1y">1 y</button>
      </div>
    </div>
  </div>
</div>

<footer>SMOKEPING 2.9 ON NOOB · GRAPHS DRAWN HERE FROM THE MIRRORED RRD DATA (SEE /API/SMOKEPING/SERIES)</footer>

<script src="/chart.min.js"></script>
<script>
  const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ESC_MAP[c]);

  const RANGES = ['3h', '30h', '10d', '1y'];
  let range = localStorage.getItem('sp-range') || '3h';
  if (!RANGES.includes(range)) range = '3h';
  let data = null;
  let flat = [];        // flat [{id, name, section}] for lightbox prev/next
  let boxIdx = -1;

  // Per-layer alpha for one nested smoke band — low on purpose: 10 of these
  // stack via ordinary canvas alpha compositing to build the density
  // gradient, so this only sets how faint the outermost edge is.
  const BAND_ALPHA = 'rgba(232,131,74,0.08)';
  // Cool mint against the warm smoke, so the real measurement doesn't
  // disappear into the haze it's drawn through.
  const SIGNAL = '#7af096';
  const LOSS = '#c9584a';
  const DIM = '#a8998a';
  const GRID = 'rgba(58,47,36,0.6)';

  const seriesUrl = (id, r) => `/api/smokeping/series?target=${encodeURIComponent(id)}&range=${r}`;

  function fmtTs(t, r) {
    const dt = new Date(t * 1000);
    if (r === '3h' || r === '30h') {
      return dt.getHours().toString().padStart(2, '0') + ':' + dt.getMinutes().toString().padStart(2, '0');
    }
    if (r === '10d') {
      return dt.toLocaleDateString('en-GB', { weekday: 'short' }) + ' ' + dt.getHours().toString().padStart(2, '0') + ':00';
    }
    return dt.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
  }

  /* A single freak ping (real, but a one-off) can blow band[0] — the
     literal min/max of 20 samples — out to 100x the normal spread, which
     would otherwise force Chart.js's auto Y-axis to squash the actual
     ~1-3ms jitter into an unreadable sliver. Bounding the axis off band[1]
     (drop just the single most extreme pair) fixes that in the common
     case where it's one flake, while leaving band[0] itself in the data
     so the spike still shows, just clipped rather than dominating. */
  function yBounds(series) {
    let lo = Infinity, hi = -Infinity;
    for (const p of series.points) {
      if (p.median_ms != null) { lo = Math.min(lo, p.median_ms); hi = Math.max(hi, p.median_ms); }
      if (p.bands) {
        const idx = Math.min(1, p.bands.length - 1);
        lo = Math.min(lo, p.bands[idx][0]);
        hi = Math.max(hi, p.bands[idx][1]);
      }
    }
    if (!isFinite(lo)) return null;
    const pad = (hi - lo) * 0.12 || Math.max(hi * 0.5, 0.5);
    return { min: Math.max(0, lo - pad), max: hi + pad };
  }

  /* ── shared chart-config builder: min/max jitter band + median line,
     loss picked out as red points. `small` drops axes/legend for tiles. */
  function chartConfig(series, small) {
    const labels = series.points.map(p => fmtTs(p.t, series.range));
    const loss = series.points.map(p => p.loss_pct);
    const pointColor = ctx => (loss[ctx.dataIndex] > 0 ? LOSS : SIGNAL);
    const pointRadius = ctx => (loss[ctx.dataIndex] > 0 ? (small ? 2 : 3) : 0);
    // The "smoke": 10 nested bands per point (outer = full spread of the 20
    // pings that interval, inner = tightest pair around the median), each
    // drawn as an equal-alpha fill. Stacked outer-to-inner, plain canvas
    // alpha compositing does the rest — the middle gets painted over by
    // every band so it reads darker/denser, exactly like the real thing.
    const bandDatasets = [];
    const bandCount = series.points.find(p => p.bands)?.bands.length || 0;
    for (let b = 0; b < bandCount; b++) {
      bandDatasets.push({
        label: `band${b}lo`, data: series.points.map(p => p.bands ? p.bands[b][0] : null),
        borderWidth: 0, pointRadius: 0, fill: false, spanGaps: false,
      });
      bandDatasets.push({
        label: `band${b}hi`, data: series.points.map(p => p.bands ? p.bands[b][1] : null),
        borderWidth: 0, pointRadius: 0, fill: '-1', spanGaps: false,
        backgroundColor: BAND_ALPHA,
      });
    }
    return {
      type: 'line',
      data: {
        labels,
        datasets: [
          ...bandDatasets,
          {
            label: 'median', data: series.points.map(p => p.median_ms),
            borderColor: SIGNAL, borderWidth: small ? 1.25 : 1.75, fill: false, spanGaps: false,
            tension: 0.2, pointRadius, pointHoverRadius: 4, pointHitRadius: 8,
            pointBackgroundColor: pointColor, pointBorderColor: pointColor,
          },
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: small ? { enabled: false } : {
            backgroundColor: '#14100c', borderColor: '#3a2f24', borderWidth: 1,
            titleColor: '#ede4d3', bodyColor: DIM, padding: 9,
            filter: item => item.dataset.label === 'median',
            callbacks: {
              label: ctx => {
                const l = loss[ctx.dataIndex];
                const ms = ctx.parsed.y;
                return ms == null ? ' no reading'
                  : ` ${ms.toFixed(2)} ms` + (l > 0 ? ` · ${l.toFixed(0)}% loss` : '');
              },
            },
          },
        },
        scales: small ? {
          x: { display: false }, y: { display: false, ...yBounds(series) },
        } : {
          x: { grid: { color: GRID }, ticks: { color: DIM, maxTicksLimit: 10, maxRotation: 0 } },
          y: { grid: { color: GRID }, ticks: { color: DIM, callback: v => v + ' ms' }, ...yBounds(series) },
        },
      },
    };
  }

  function statsLine(series) {
    const meds = series.points.map(p => p.median_ms).filter(v => v != null);
    const losses = series.points.map(p => p.loss_pct).filter(v => v != null);
    if (!meds.length) return 'no readings in range';
    const avg = meds.reduce((a, b) => a + b, 0) / meds.length;
    const max = Math.max(...meds);
    const lossMax = losses.length ? Math.max(...losses) : 0;
    const lossCls = lossMax > 0 ? 'loss warn' : 'loss';
    return `avg <b>${avg.toFixed(2)} ms</b> · peak <b>${max.toFixed(2)} ms</b> · ` +
      `worst loss <span class="${lossCls}">${lossMax.toFixed(0)}%</span>`;
  }

  /* ── tile charts ── */
  const tileCharts = new Map(); // id -> Chart

  async function loadTile(id, canvas, wrap, statsEl) {
    try {
      const r = await fetch(seriesUrl(id, range));
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const series = await r.json();
      wrap.classList.remove('broken');
      const cfg = chartConfig(series, true);
      const existing = tileCharts.get(id);
      if (existing) { existing.data = cfg.data; existing.update('none'); }
      else tileCharts.set(id, new Chart(canvas, cfg));
      if (statsEl) statsEl.innerHTML = statsLine(series);
    } catch (e) {
      wrap.classList.add('broken');
      const existing = tileCharts.get(id);
      if (existing) { existing.destroy(); tileCharts.delete(id); }
      if (statsEl) statsEl.textContent = '';
    }
  }

  /* ── range pills ── */
  function paintRanges() {
    document.querySelectorAll('.range-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.r === range));
  }
  function setRange(r) {
    range = r;
    localStorage.setItem('sp-range', r);
    paintRanges();
    document.querySelectorAll('.tile').forEach(tile => {
      const id = flat[tile.dataset.idx].id;
      loadTile(id, tile.querySelector('canvas'), tile.querySelector('.shot'), tile.querySelector('.tile-stats'));
    });
    if (boxIdx >= 0) loadBox(boxIdx);
  }
  document.querySelectorAll('#ranges .range-btn, #box-ranges .range-btn').forEach(b =>
    b.addEventListener('click', () => setRange(b.dataset.r)));

  /* ── build sections ── */
  function build() {
    const host = document.getElementById('sections');
    host.innerHTML = '';
    tileCharts.forEach(c => c.destroy());
    tileCharts.clear();
    flat = [];
    for (const sec of data.sections || []) {
      const secEl = document.createElement('section');
      secEl.dataset.sec = sec.id;
      secEl.innerHTML =
        `<div class="sec-head"><span class="sec-name">${esc(sec.name)}</span>` +
        `<span class="sec-count">${sec.targets.length} target${sec.targets.length === 1 ? '' : 's'}</span>` +
        `<span class="sec-rule"></span></div><div class="grid"></div>`;
      const grid = secEl.querySelector('.grid');
      for (const t of sec.targets) {
        const idx = flat.length;
        flat.push({ id: t.id, name: t.name, section: sec.name });
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.tabIndex = 0;
        tile.dataset.idx = idx;
        tile.dataset.search = `${t.name} ${t.id} ${sec.name}`.toLowerCase();
        tile.setAttribute('role', 'button');
        tile.setAttribute('aria-label', `Enlarge latency graph for ${t.name}`);
        tile.innerHTML =
          `<div class="tile-cap"><span class="tile-name">${esc(t.name)}</span>` +
          `<span class="tile-id">${esc(t.id)}</span></div>` +
          `<div class="shot"><canvas></canvas></div>` +
          `<div class="tile-stats">loading…</div>`;
        tile.addEventListener('click', () => openBox(idx));
        tile.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openBox(idx); }
        });
        grid.appendChild(tile);
        loadTile(t.id, tile.querySelector('canvas'), tile.querySelector('.shot'), tile.querySelector('.tile-stats'));
      }
      host.appendChild(secEl);
    }
    applyFilter();
  }

  /* ── filter ── */
  const filterEl = document.getElementById('filter');
  function applyFilter() {
    const q = filterEl.value.trim().toLowerCase();
    document.querySelectorAll('#sections section').forEach(sec => {
      let vis = 0;
      sec.querySelectorAll('.tile').forEach(t => {
        const show = !q || t.dataset.search.includes(q);
        t.classList.toggle('hidden', !show);
        if (show) vis++;
      });
      sec.classList.toggle('hidden', vis === 0);
    });
  }
  filterEl.addEventListener('input', applyFilter);

  /* ── lightbox ── */
  const box = document.getElementById('box');
  const boxCanvas = document.getElementById('box-canvas');
  const boxShot = document.querySelector('.box-shot');
  const boxStats = document.getElementById('box-stats');
  let boxChart = null;
  async function loadBox(idx) {
    const t = flat[idx];
    try {
      const r = await fetch(seriesUrl(t.id, range));
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const series = await r.json();
      boxShot.classList.remove('broken');
      const cfg = chartConfig(series, false);
      if (boxChart) { boxChart.data = cfg.data; boxChart.options = cfg.options; boxChart.update(); }
      else boxChart = new Chart(boxCanvas, cfg);
      boxStats.innerHTML = statsLine(series);
    } catch (e) {
      boxShot.classList.add('broken');
      if (boxChart) { boxChart.destroy(); boxChart = null; }
      boxStats.textContent = '';
    }
  }
  function openBox(idx) {
    boxIdx = (idx + flat.length) % flat.length;
    const t = flat[boxIdx];
    document.getElementById('box-title').textContent = t.name;
    document.getElementById('box-id').textContent = `${t.section} · ${t.id}`;
    document.getElementById('box-raw').href = `${data.base}?target=${encodeURIComponent(t.id)}`;
    loadBox(boxIdx);
    box.classList.add('open');
    document.getElementById('box-close').focus();
  }
  function closeBox() { box.classList.remove('open'); boxIdx = -1; }
  document.getElementById('box-close').addEventListener('click', closeBox);
  document.getElementById('box-prev').addEventListener('click', () => openBox(boxIdx - 1));
  document.getElementById('box-next').addEventListener('click', () => openBox(boxIdx + 1));
  box.addEventListener('click', e => { if (e.target === box) closeBox(); });
  document.addEventListener('keydown', e => {
    if (!box.classList.contains('open')) return;
    if (e.key === 'Escape') closeBox();
    if (e.key === 'ArrowLeft')  openBox(boxIdx - 1);
    if (e.key === 'ArrowRight') openBox(boxIdx + 1);
  });

  /* ── status line ── */
  let rrdStatus = null;
  function paintStatus() {
    const dot = document.getElementById('dot');
    const stat = document.getElementById('stat-text');
    const age = Math.round((Date.now() / 1000 - data.ts) / 60);
    const stale = age > 30;
    dot.className = 'live-dot ' + (data.ok && !stale ? 'up' : 'down');
    stat.textContent = `${data.ok ? 'live' : 'unreachable'} · ${data.target_count} targets · polled ${age < 1 ? 'just now' : age + ' m ago'}`;
    document.getElementById('raw-link').href = data.base;
    document.getElementById('sub-line').innerHTML =
      `<b>${data.target_count}</b> targets · probed every <b>300 s</b> on noob · ` +
      `${(data.sections || []).map(s => esc(s.name)).join(' · ').toLowerCase()}`;
    const notice = document.getElementById('notice');
    const rrdAge = rrdStatus ? Math.round((Date.now() / 1000 - rrdStatus.ts) / 60) : null;
    if (!data.ok) {
      notice.innerHTML = `<b>SmokePing's target list is not answering</b> (${esc(data.error)}). ` +
        `Showing the last known target list — graphs still come from the RRD mirror below.`;
      notice.classList.remove('hidden');
    } else if (rrdStatus && !rrdStatus.ok) {
      notice.innerHTML = `<b>RRD mirror sync failed</b> (${esc(rrdStatus.error)}). ` +
        `Graphs may be stale or blank until pollers/smokeping_rrd.py recovers.`;
      notice.classList.remove('hidden');
    } else if (rrdAge != null && rrdAge > 15) {
      notice.innerHTML = `<b>RRD mirror is ${rrdAge} minutes old</b> — the sync poller may have stopped.`;
      notice.classList.remove('hidden');
    } else if (stale) {
      notice.innerHTML = `<b>Target list is ${age} minutes old</b> — the menu poller may have stopped. ` +
        `Graphs are still current.`;
      notice.classList.remove('hidden');
    } else {
      notice.classList.add('hidden');
    }
  }

  /* ── load ── */
  async function load(rebuild) {
    try {
      const [dr, rr] = await Promise.all([
        fetch('/api/smokeping'),
        fetch('/api/smokeping/rrd').catch(() => null),
      ]);
      if (!dr.ok) throw new Error('HTTP ' + dr.status);
      data = await dr.json();
      rrdStatus = (rr && rr.ok) ? await rr.json() : rrdStatus;
    } catch (e) {
      document.getElementById('empty').textContent =
        'No smokeping data yet — run pollers/smokeping.py once, or check that steve can reach 192.168.1.212.';
      document.getElementById('empty').classList.remove('hidden');
      document.getElementById('stat-text').textContent = 'no data';
      return;
    }
    document.getElementById('empty').classList.add('hidden');
    paintStatus();
    if (rebuild) build();
  }

  /* Charts redraw only when the 5-min probe bucket rolls over — matches the
     sync poller's cadence, no point refetching more often than that. */
  const bucket = () => Math.floor(Date.now() / 300000);
  let lastBucket = bucket();
  function refreshCharts() {
    if (bucket() === lastBucket) return;
    lastBucket = bucket();
    document.querySelectorAll('.tile').forEach(tile => {
      const id = flat[tile.dataset.idx].id;
      loadTile(id, tile.querySelector('canvas'), tile.querySelector('.shot'), tile.querySelector('.tile-stats'));
    });
    if (boxIdx >= 0) loadBox(boxIdx);
    document.getElementById('refreshed').textContent =
      'graphs refreshed ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  }

  paintRanges();
  load(true);
  setInterval(() => { load(false); refreshCharts(); }, 60000);
</script>
</body>
