<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jeff</title>
<script src="/chart.min.js"></script>
<script src="/hostcard.js"></script>
<link rel="stylesheet" href="/hostcard.css">
<style>
  :root { --sdr: #b57edc; }
  .gauges { gap: 1.2rem; }

  .advisory { font-family: var(--font-mono); font-size: 0.68rem; color: var(--down); }

  /* ── Alerts / health flags ── */
  .ack-btn {
    padding: 0.3rem 0.8rem; border-radius: 4px; border: 1px solid var(--bezel);
    background: var(--panel); color: var(--ink-dim); font-size: 0.64rem;
    letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; transition: border-color 0.2s, color 0.2s;
    flex-shrink: 0; align-self: center;
  }
  .ack-btn:hover { border-color: var(--bezel-lit); color: var(--ink); }
  .alert-list { display: flex; flex-direction: column; gap: 0.6rem; }
  .alert-item {
    background: var(--panel); border: 1px solid var(--bezel); border-left: 3px solid var(--warn);
    border-radius: 4px; padding: 0.7rem 0.9rem; display: flex; align-items: center; gap: 0.9rem;
  }
  .alert-item.critical { border-left-color: var(--down); }
  .alert-item.calm { border-left-color: var(--ok); }
  .alert-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.2rem; }
  .alert-item-top { display: flex; align-items: baseline; gap: 0.5rem; }
  .alert-header { font-size: 0.78rem; font-weight: 600; }
  .alert-item.critical .alert-header { color: var(--down); }
  .alert-item.calm .alert-header { color: var(--ok); }
  .alert-item:not(.critical):not(.calm) .alert-header { color: var(--warn); }
  .alert-text { font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-dim); }
  .alert-time { font-family: var(--font-mono); font-size: 0.6rem; color: var(--ink-faint); margin-left: auto; }

  /* ── SDR panel ── */
  .sdr-card {
    background: var(--panel); border: 1px solid var(--bezel); border-radius: 6px;
    border-left: 3px solid var(--sdr); padding: 1.2rem 1.4rem;
    display: flex; flex-direction: column; gap: 0.9rem;
  }
  .sdr-head { display: flex; align-items: center; gap: 0.6rem; }
  .sdr-dongle { font-size: 0.9rem; font-weight: 600; color: var(--ink); }
  .sdr-dongle small { font-family: var(--font-mono); font-size: 0.68rem; color: var(--ink-faint); font-weight: 400; }
  .adsb-strip {
    display: flex; align-items: baseline; flex-wrap: wrap; gap: 0.3rem 1rem;
    padding: 0.7rem 0.9rem; background: var(--inset);
    border: 1px solid var(--bezel); border-radius: 4px;
  }
  .adsb-big { font-family: var(--font-mono); font-size: 1.1rem; color: var(--ink); }
  .adsb-big b { color: var(--sdr); font-size: 1.5rem; font-weight: 700; }
  .adsb-sub { font-family: var(--font-mono); font-size: 0.68rem; color: var(--ink-dim); }
  .adsb-flights {
    border: 1px solid var(--bezel); border-radius: 4px; overflow: hidden;
  }
  .adsb-flight {
    display: flex; align-items: baseline; gap: 0.6rem;
    font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-dim);
    padding: 0.32rem 0.9rem; border-top: 1px solid var(--inset);
  }
  .adsb-flight:first-child { border-top: 0; }
  .adsb-flight .cs { color: var(--ink); font-weight: 600; min-width: 4.6rem; flex-shrink: 0; }
  .adsb-flight .rt { color: var(--sdr); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .adsb-flight .rt .arr { color: var(--ink-faint); }
  .adsb-flight .rt.unknown { color: var(--ink-faint); }
  .adsb-flight .alt { margin-left: auto; color: var(--ink-faint); flex-shrink: 0; }
  .sdr-row { display: flex; flex-wrap: wrap; gap: 0.5rem 0.7rem; align-items: baseline; }
  .sdr-row .k {
    font-size: 0.58rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-faint); flex-shrink: 0; min-width: 4.4rem;
  }
  .chip {
    font-family: var(--font-mono); font-size: 0.66rem; color: var(--ink-dim);
    background: var(--inset); border: 1px solid var(--bezel); border-radius: 3px;
    padding: 0.15rem 0.5rem;
  }
  .chip.none { color: var(--ink-faint); border-style: dashed; }
  .sdr-note { font-family: var(--font-mono); font-size: 0.68rem; color: var(--warn); }
  .fail-strip { display: inline-flex; gap: 2px; align-items: stretch; height: 15px; }
  .fail-cell {
    width: 6px; border-radius: 1px;
    background: var(--inset); border: 1px solid var(--bezel);
  }
  .fail-cell[data-n="1"] { background: var(--sdr); border-color: var(--sdr); opacity: 0.45; }
  .fail-cell[data-n="2"] { background: var(--sdr); border-color: var(--sdr); opacity: 0.75; }
  .fail-cell[data-n="3"] { background: var(--warn); border-color: var(--warn); }
  .sdr-actions { display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; }
  .sdr-btn {
    font-family: var(--font-mono); font-size: 0.66rem; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer;
    color: var(--ink-dim); background: var(--inset);
    border: 1px solid var(--bezel); border-radius: 3px; padding: 0.3rem 0.7rem;
  }
  .sdr-btn:hover:not(:disabled) { color: var(--ink); border-color: var(--sdr); }
  .sdr-btn:disabled { opacity: 0.5; cursor: progress; }
  .sdr-btn-msg { font-family: var(--font-mono); font-size: 0.64rem; color: var(--ink-faint); }
  .sdr-btn-msg.bad { color: var(--warn); }

  /* ── Process manifests ── */
  .manifests { display: grid; grid-template-columns: 1fr 1fr; gap: 1.1rem; }
  @media (max-width: 700px) { .manifests { grid-template-columns: 1fr; } }
  .manifest-card { background: var(--panel); border: 1px solid var(--bezel); border-radius: 6px; padding: 1.2rem 1.4rem; }
  .rows { font-family: var(--font-mono); font-size: 0.72rem; }
  .rows .row {
    display: grid; grid-template-columns: 3.2rem 1fr 3rem 3rem; gap: 0.6rem;
    padding: 0.4rem 0; border-bottom: 1px solid var(--inset); color: var(--ink-dim);
  }
  .rows .row:last-child { border-bottom: none; }
  .rows .row span:first-child { color: var(--ink-faint); }
  .rows .row .proc-name { color: var(--ink); }

  /* ── Live map (tar1090, proxied from jeff) ── */
  .map-frame {
    border: 1px solid var(--bezel); border-radius: 6px; overflow: hidden;
    background: var(--panel); height: 480px;
  }
  .map-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
  @media (max-width: 620px) { .map-frame { height: 360px; } }

  body.stale header.topbar { box-shadow: inset 0 -2px 0 var(--warn); }
  body.stale footer.updated { color: var(--warn); }

  footer.updated {
    max-width: 1120px; margin: 0 auto; padding: 0 1.6rem 2rem;
    font-family: var(--font-mono); font-size: 0.62rem; color: var(--ink-faint); text-align: right;
  }
</style>
  <script src="/auth.js"></script>
</head>
<body>

<header class="topbar">
  <a class="home-link" href="/">← HOME</a>
  <div class="plate-name">JEFF</div>
  <div class="status-led"><span class="lamp" id="status-lamp"></span><span id="status-text">READING…</span></div>
</header>

<main class="frame">

  <section class="hero">
    <div class="hero-id">
      <div class="eyebrow">HOST</div>
      <h1 id="hostname">jeff</h1>
      <div class="uname" id="uname">—</div>
    </div>
    <div class="gauges" id="gauges"></div>
  </section>

  <section id="alerts-section" style="display:none">
    <div class="eyebrow">⚠ ALERTS</div>
    <div class="alert-list" id="alert-list"></div>
  </section>

  <section class="trend-card">
    <div class="trend-head">
      <div class="eyebrow" style="margin-bottom:0">TREND · LAST 48H</div>
      <div class="legend" id="legend"></div>
    </div>
    <canvas id="ch-history" height="70"></canvas>
  </section>

  <section>
    <div class="eyebrow">SDR — RTL-SDR RIG</div>
    <div class="sdr-card" id="sdr-card"></div>
  </section>

  <section>
    <div class="eyebrow">LIVE MAP — TAR1090</div>
    <div class="map-frame">
      <iframe src="/jeff/map/" loading="lazy" title="Live ADS-B map (tar1090, on jeff)"></iframe>
    </div>
  </section>

  <section>
    <div class="eyebrow">PI HEALTH — UNDER-VOLTAGE &amp; THROTTLING</div>
    <div class="alert-list" id="health-list"></div>
  </section>

  <section>
    <div class="advisory" id="other-failed"></div>
  </section>

  <section class="manifests">
    <div class="manifest-card">
      <div class="eyebrow">TOP CPU</div>
      <div class="rows" id="top-cpu"></div>
    </div>
    <div class="manifest-card">
      <div class="eyebrow">TOP MEMORY</div>
      <div class="rows" id="top-mem"></div>
    </div>
  </section>

</main>

<footer class="updated" id="updated"></footer>

<script>
  async function loadHistory(cpus) {
    try {
      const r = await fetch('/api/jeff/history');
      const d = await r.json();
      renderHistory(d.points || [], cpus || 1);
    } catch {}
  }

  function chips(items, emptyLabel) {
    if (!items || !items.length) return `<span class="chip none">${esc(emptyLabel)}</span>`;
    return items.map(x => `<span class="chip">${esc(x)}</span>`).join('');
  }

  function fmtAgo(sec) {
    if (sec == null) return '—';
    if (sec < 90) return `${Math.round(sec)}s ago`;
    if (sec < 5400) return `${Math.round(sec / 60)}m ago`;
    if (sec < 172800) return `${Math.round(sec / 3600)}h ago`;
    return `${Math.round(sec / 86400)}d ago`;
  }

  // epoch seconds -> "HH:MM", prefixed with the weekday when it isn't today
  function fmtClock(sec) {
    const d = new Date(sec * 1000);
    const t = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    return d.toDateString() === new Date().toDateString()
      ? t : `${d.toLocaleDateString('en-GB', { weekday: 'short' })} ${t}`;
  }

  function renderSdr(sdr, adsb, wd) {
    const card = document.getElementById('sdr-card');
    if (!sdr) { card.innerHTML = '<span class="chip none">no data</span>'; return; }
    const present = sdr.dongle_present;
    const squat = present && sdr.dvb_driver_loaded && !sdr.sdr_driver_loaded;
    const readsbUp = (sdr.services || []).some(s => /readsb/.test(s));
    const adsbStrip = adsb ? `
      <div class="adsb-strip">
        <span class="adsb-big"><b>${adsb.aircraft}</b> aircraft</span>
        <span class="adsb-sub">${adsb.positions} with position · ${adsb.msgs_per_sec.toLocaleString()} msg/s${
          adsb.max_range_km != null ? ` · ${adsb.max_range_km} km max` : ''}</span>
      </div>` : '';

    // strongest-signal flights overhead, with adsbdb.com origin/destination when known
    const fmtAlt = a => {
      if (a == null) return '';
      if (a === 'ground') return 'GND';
      return a >= 18000 ? `FL${Math.round(a / 100)}` : `${a.toLocaleString()} ft`;
    };
    // Private/GA aircraft fly under an owner callsign, not a scheduled route —
    // adsbdb's route lookup comes back empty for them, so fall back to
    // registration/owner (looked up by hex) instead of just saying "unknown".
    const ownerCell = ac => {
      const bits = [ac.reg, ac.owner].filter(Boolean).join(' · ');
      return bits
        ? `<span class="rt unknown" title="${esc([ac.type, ac.owner_country].filter(Boolean).join(' · '))}">${esc(bits)}</span>`
        : '<span class="rt unknown">route unknown</span>';
    };
    const routeCell = f => {
      const r = f.route;
      if (!r) return f.aircraft ? ownerCell(f.aircraft) : '<span class="rt unknown">route unknown</span>';
      const code = ap => esc((ap && (ap.iata || ap.icao)) || '??');
      const via = (r.via && r.via.length)
        ? ` <span class="arr">via</span> ${r.via.map(esc).join(', ')}` : '';
      return `<span class="rt">${code(r.origin)} <span class="arr">→</span> ${code(r.dest)}${via}</span>`;
    };
    const flightTitle = f => {
      const r = f.route;
      if (r) {
        const name = ap => (ap && (ap.name || ap.city)) || '';
        return `${f.cs}   ${name(r.origin)}  →  ${name(r.dest)}`.trim();
      }
      const ac = f.aircraft;
      if (ac) return `${f.cs}   ${[ac.manufacturer, ac.type].filter(Boolean).join(' ')}   ${ac.owner || ''}`.trim();
      return f.cs;
    };
    const flightRows = (adsb && adsb.flights && adsb.flights.length) ? `
      <div class="adsb-flights">${adsb.flights.slice(0, 6).map(f => `
        <div class="adsb-flight" title="${esc(flightTitle(f))}">
          <span class="cs">${esc(f.cs)}</span>
          ${routeCell(f)}
          <span class="alt">${esc(fmtAlt(f.alt))}</span>
        </div>`).join('')}</div>` : '';

    // auto-heal status (readsb-recover on jeff — usbreset + restart on a wedge)
    let healRow = '';
    if (wd && wd.installed) {
      const bits = [`last fired ${fmtAgo(wd.last_fire_age)}`];
      if (wd.last_result) bits.push(wd.last_result === 'recovered' ? 'recovered' : '⚠ still deaf');
      bits.push(`${wd.fires_24h}× in 24h`);
      healRow = `<div class="sdr-row"><span class="k">Auto-heal</span>
        <span class="chip">${esc(bits.join(' · '))}</span></div>`;
    } else if (wd) {
      healRow = `<div class="sdr-row"><span class="k">Auto-heal</span><span class="chip none">standing by</span></div>`;
    }

    // last-48h failure timeline — one cell per 2h bucket, oldest → the bucket ending
    // now; hovering a cell lists the wall-clock time of each usbreset in it
    let failRow = '';
    if (wd && (wd.bucket_epochs || wd.fails_by_bucket)) {
      const step = wd.fail_bucket_h || 2;
      const be = wd.bucket_epochs || null;
      const counts = wd.fails_by_bucket || be.map(b => b.length);
      const win = wd.fail_window_h || counts.length * step;
      const cells = counts.map((n, i) => {
        const hi = win - i * step, lo = hi - step;   // this cell spans hi..lo hours ago
        const lvl = n === 0 ? 0 : Math.min(n, 3);
        const times = (be && be[i].length) ? ` · ${be[i].map(fmtClock).join(', ')}` : '';
        const title = n === 0
          ? `no resets · ${hi}–${lo}h ago`
          : `${n} reset${n === 1 ? '' : 's'} · ${hi}–${lo}h ago${times}`;
        return `<span class="fail-cell" data-n="${lvl}" title="${esc(title)}"></span>`;
      }).join('');
      const tot = wd.fails_recent || 0;
      failRow = `<div class="sdr-row"><span class="k">Fails ${win}h</span>
        <span class="fail-strip">${cells}</span>
        <span class="chip${tot ? '' : ' none'}">${tot} total</span></div>`;
    }

    // the individual usbresets behind those counts (readsb-recover fires), newest first
    let resetRow = '';
    if (wd && wd.recent_fires && wd.recent_fires.length) {
      const shown = wd.recent_fires.map(s => `<span class="chip">${fmtAgo(s)}</span>`).join('');
      const more = (wd.fails_recent || 0) - wd.recent_fires.length;
      resetRow = `<div class="sdr-row"><span class="k">usbresets</span>${shown}` +
        (more > 0 ? `<span class="chip none">+${more} older</span>` : '') + `</div>`;
    }

    const flapNote = (wd && wd.fires_24h >= 4)
      ? `<div class="sdr-note">⚠ auto-heal has usbreset the dongle ${wd.fires_24h}× in 24h — the £30 stick is failing, reseat or swap it</div>`
      : '';

    const actions = readsbUp ? `
      <div class="sdr-actions">
        <button class="sdr-btn" id="readsb-restart-btn">Restart readsb</button>
        <span class="sdr-btn-msg" id="readsb-restart-msg"></span>
      </div>` : '';

    card.innerHTML = `
      <div class="sdr-head">
        <span class="lamp ${present ? 'on' : ''}"></span>
        <span class="sdr-dongle">${present ? 'RTL-SDR detected' : 'No RTL-SDR on USB'}
          ${present && sdr.dongle_name ? `<small>${esc(sdr.dongle_name)}</small>` : ''}</span>
      </div>
      ${adsbStrip}
      ${flightRows}
      ${squat ? `<div class="sdr-note">⚠ dvb_usb_rtl28xxu is holding the dongle — blacklist it so librtlsdr can use it</div>` : ''}
      ${flapNote}
      <div class="sdr-row"><span class="k">Driver</span>${
        sdr.sdr_driver_loaded ? '<span class="chip">rtl2832 (SDR)</span>'
        : sdr.dvb_driver_loaded ? '<span class="chip">dvb_usb_rtl28xxu (DVB-T)</span>'
        : '<span class="chip none">none loaded</span>'}</div>
      <div class="sdr-row"><span class="k">Tools</span>${chips(sdr.tools, 'none installed')}</div>
      <div class="sdr-row"><span class="k">Services</span>${chips(sdr.services, 'none running')}</div>
      ${healRow}
      ${failRow}
      ${resetRow}
      ${actions}
    `;

    const btn = document.getElementById('readsb-restart-btn');
    if (btn) btn.addEventListener('click', () => restartReadsb(btn));
  }

  async function restartReadsb(btn) {
    if (!window.confirm('Restart readsb on jeff?\n(usbreset the dongle + restart the service — takes ~30s)')) return;
    const msg = document.getElementById('readsb-restart-msg');
    btn.disabled = true;
    msg.className = 'sdr-btn-msg';
    msg.textContent = 'working… (usbreset + restart)';
    try {
      const r = await fetch('/api/jeff/readsb-restart', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}',
      });
      const d = await r.json();
      msg.textContent = d.ok ? 'readsb is hearing planes again' : (d.error || 'restart failed');
      if (!d.ok) msg.className = 'sdr-btn-msg bad';
    } catch (e) {
      msg.textContent = 'request failed'; msg.className = 'sdr-btn-msg bad';
    } finally {
      btn.disabled = false;
      load();
    }
  }

  function renderHealth(d) {
    const list = document.getElementById('health-list');
    const flags = (d.throttled && d.throttled.flags) || [];
    if (!d.throttled || !d.throttled.available) {
      list.innerHTML = `<div class="alert-item"><div class="alert-body"><div class="alert-item-top">
        <span class="alert-header">vcgencmd unavailable</span></div>
        <div class="alert-text">can't read the under-voltage / throttling bitfield on this host</div></div></div>`;
      return;
    }
    if (!flags.length) {
      list.innerHTML = `<div class="alert-item calm"><div class="alert-body"><div class="alert-item-top">
        <span class="alert-header">Clean</span></div>
        <div class="alert-text">no under-voltage or throttling flags set (${esc(d.throttled.raw)})</div></div></div>`;
      return;
    }
    list.innerHTML = flags.map(f => `
      <div class="alert-item ${f.level === 'critical' ? 'critical' : ''}">
        <div class="alert-body">
          <div class="alert-item-top">
            <span class="alert-header">${esc(f.header)}</span>
            <span class="alert-time">${f.when === 'now' ? 'happening now' : 'since boot'}</span>
          </div>
          <div class="alert-text">${esc(f.detail)}</div>
        </div>
      </div>`).join('');
  }

  // ── Alerts (each acknowledged individually — an ack is "id -> onset ts",
  // so a re-triggered episode with a fresh onset ts un-acks itself) ──
  const ACKS_KEY = 'jeff_alert_acks';
  async function load() {
    ensureGauges(true);
    try {
      const r = await fetch('/api/jeff');
      const d = await r.json();
      if (d.error) {
        document.getElementById('status-text').textContent = 'ERROR';
        document.getElementById('status-lamp').className = 'lamp down';
        document.getElementById('uname').textContent = esc(d.error);
        return;
      }

      const alertSummary = renderAlerts(d.alerts || [], ACKS_KEY);
      const lamp = document.getElementById('status-lamp');
      const statusText = document.getElementById('status-text');
      const lampCls = alertSummary.critical ? 'down' : alertSummary.count ? 'warn' : 'on';
      lamp.className = 'lamp ' + lampCls;
      statusText.textContent = alertSummary.count ? `${alertSummary.count} ALERT${alertSummary.count > 1 ? 'S' : ''}` : 'ALL SYSTEMS UP';

      document.getElementById('hostname').textContent = d.hostname;
      document.getElementById('uname').textContent =
        `${esc(d.model || 'Raspberry Pi')} · ${d.load.cpus} cores · up ${fmtUptime(d.uptime_seconds)}`;

      const loadPct = d.load['1m'] / d.load.cpus * 100;
      const loadCls = loadPct > 100 ? 'down' : loadPct > 70 ? 'warn' : 'ok';
      setGauge('load', loadPct, loadCls, d.load['1m'].toFixed(2), 'LOAD 1M', `${d.load['5m']} / ${d.load['15m']} · 5m/15m`);

      const memCls = d.mem.percent > 90 ? 'down' : d.mem.percent > 75 ? 'warn' : 'ok';
      setGauge('mem', d.mem.percent, memCls, d.mem.percent + '%', 'MEMORY', `${d.mem.used_mb.toLocaleString()} / ${d.mem.total_mb.toLocaleString()} MB`);

      const diskCls = d.disk.percent > 90 ? 'down' : d.disk.percent > 75 ? 'warn' : 'ok';
      setGauge('disk', d.disk.percent, diskCls, d.disk.percent + '%', 'DISK /', `${d.disk.used_gb} / ${d.disk.total_gb} GB`);

      if (d.cpu_temp != null) {
        const t = d.cpu_temp;
        const tCls = t >= 80 ? 'down' : t >= 65 ? 'warn' : 'ok';
        setGauge('temp', t / 90 * 100, tCls, Math.round(t) + '°', 'SOC TEMP', `${t} °C`);
      } else {
        setGauge('temp', 0, 'ok', '—', 'SOC TEMP', 'no sensor');
      }

      renderSdr(d.sdr, d.adsb, d.readsb_watchdog);
      renderHealth(d);

      const otherFailed = document.getElementById('other-failed');
      otherFailed.textContent = d.other_failed && d.other_failed.length
        ? `Failed units: ${d.other_failed.join(', ')}` : '';

      document.getElementById('top-cpu').innerHTML = (d.top_cpu || []).map(procRow).join('') || '<div class="row"><span>—</span></div>';
      document.getElementById('top-mem').innerHTML = (d.top_mem || []).map(procRow).join('') || '<div class="row"><span>—</span></div>';

      markStale(d);
      loadHistory(d.load.cpus);
    } catch (e) {
      document.getElementById('status-text').textContent = 'OFFLINE';
      document.getElementById('status-lamp').className = 'lamp down';
    }
  }

  load();
  setInterval(load, 15000);
</script>
</body>
</html>
