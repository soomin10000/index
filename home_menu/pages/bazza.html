<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bazza</title>
<script src="/chart.min.js"></script>
<script src="/hostcard.js"></script>
<link rel="stylesheet" href="/hostcard.css">
<style>
  :root { --dns: #6aab5b; }
  .gauges { gap: 1.2rem; }

  .advisory { font-family: var(--font-mono); font-size: 0.68rem; color: var(--down); }

  /* ── Alerts / health flags ── */
  .ack-btn {
    padding: 0.3rem 0.8rem; border-radius: 4px; border: 1px solid var(--bezel);
    background: var(--panel); color: var(--ink-dim); font-size: 0.64rem;
    letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; transition: border-color 0.2s, color 0.2s;
    flex-shrink: 0; align-self: center;
  }
  .ack-btn:hover { border-color: var(--bezel-lit); color: var(--ink); }
  .alert-list { display: flex; flex-direction: column; gap: 0.6rem; }
  .alert-item {
    background: var(--panel); border: 1px solid var(--bezel); border-left: 3px solid var(--warn);
    border-radius: 4px; padding: 0.7rem 0.9rem; display: flex; align-items: center; gap: 0.9rem;
  }
  .alert-item.critical { border-left-color: var(--down); }
  .alert-item.calm { border-left-color: var(--ok); }
  .alert-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.2rem; }
  .alert-item-top { display: flex; align-items: baseline; gap: 0.5rem; }
  .alert-header { font-size: 0.78rem; font-weight: 600; }
  .alert-item.critical .alert-header { color: var(--down); }
  .alert-item.calm .alert-header { color: var(--ok); }
  .alert-item:not(.critical):not(.calm) .alert-header { color: var(--warn); }
  .alert-text { font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-dim); }
  .alert-time { font-family: var(--font-mono); font-size: 0.6rem; color: var(--ink-faint); margin-left: auto; }

  /* ── DNS panel ── */
  .dns-card {
    background: var(--panel); border: 1px solid var(--bezel); border-radius: 6px;
    border-left: 3px solid var(--dns); padding: 1.2rem 1.4rem;
    display: flex; flex-direction: column; gap: 0.9rem;
  }
  .dns-head { display: flex; align-items: center; gap: 0.6rem; }
  .dns-title { font-size: 0.9rem; font-weight: 600; color: var(--ink); }
  .dns-strip {
    display: flex; align-items: baseline; flex-wrap: wrap; gap: 0.3rem 1rem;
    padding: 0.7rem 0.9rem; background: var(--inset);
    border: 1px solid var(--bezel); border-radius: 4px;
  }
  .dns-big { font-family: var(--font-mono); font-size: 1.1rem; color: var(--ink); }
  .dns-big b { color: var(--dns); font-size: 1.5rem; font-weight: 700; }
  .dns-sub { font-family: var(--font-mono); font-size: 0.68rem; color: var(--ink-dim); }
  .dns-row { display: flex; flex-wrap: wrap; gap: 0.5rem 0.7rem; align-items: baseline; }
  .dns-row .k {
    font-size: 0.58rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-faint); flex-shrink: 0; min-width: 4.8rem;
  }
  .chip {
    font-family: var(--font-mono); font-size: 0.66rem; color: var(--ink-dim);
    background: var(--inset); border: 1px solid var(--bezel); border-radius: 3px;
    padding: 0.15rem 0.5rem;
  }
  .chip.none { color: var(--ink-faint); border-style: dashed; }
  .chip.ok   { color: var(--ok);   border-color: color-mix(in srgb, var(--ok) 45%, var(--bezel)); }
  .chip.down { color: var(--down); border-color: color-mix(in srgb, var(--down) 45%, var(--bezel)); }
  .dns-note { font-family: var(--font-mono); font-size: 0.68rem; color: var(--warn); }

  /* ── Process manifests ── */
  .manifests { display: grid; grid-template-columns: 1fr 1fr; gap: 1.1rem; }
  @media (max-width: 700px) { .manifests { grid-template-columns: 1fr; } }
  .manifest-card { background: var(--panel); border: 1px solid var(--bezel); border-radius: 6px; padding: 1.2rem 1.4rem; }
  .rows { font-family: var(--font-mono); font-size: 0.72rem; }
  .rows .row {
    display: grid; grid-template-columns: 3.2rem 1fr 3rem 3rem; gap: 0.6rem;
    padding: 0.4rem 0; border-bottom: 1px solid var(--inset); color: var(--ink-dim);
  }
  .rows .row:last-child { border-bottom: none; }
  .rows .row span:first-child { color: var(--ink-faint); }
  .rows .row .proc-name { color: var(--ink); }

  body.stale header.topbar { box-shadow: inset 0 -2px 0 var(--warn); }
  body.stale footer.updated { color: var(--warn); }

  footer.updated {
    max-width: 1120px; margin: 0 auto; padding: 0 1.6rem 2rem;
    font-family: var(--font-mono); font-size: 0.62rem; color: var(--ink-faint); text-align: right;
  }
</style>
  <script src="/auth.js"></script>
</head>
<body>

<header class="topbar">
  <a class="home-link" href="/">← HOME</a>
  <div class="plate-name">BAZZA</div>
  <div class="status-led"><span class="lamp" id="status-lamp"></span><span id="status-text">READING…</span></div>
</header>

<main class="frame">

  <section class="hero">
    <div class="hero-id">
      <div class="eyebrow">HOST</div>
      <h1 id="hostname">bazza</h1>
      <div class="uname" id="uname">—</div>
    </div>
    <div class="gauges" id="gauges"></div>
  </section>

  <section id="alerts-section" style="display:none">
    <div class="eyebrow">⚠ ALERTS</div>
    <div class="alert-list" id="alert-list"></div>
  </section>

  <section class="trend-card">
    <div class="trend-head">
      <div class="eyebrow" style="margin-bottom:0">TREND · LAST 48H</div>
      <div class="legend" id="legend"></div>
    </div>
    <canvas id="ch-history" height="70"></canvas>
  </section>

  <section>
    <div class="eyebrow">DNS — PI-HOLE</div>
    <div class="dns-card" id="dns-card"></div>
  </section>

  <section>
    <div class="eyebrow">PI HEALTH — UNDER-VOLTAGE &amp; THROTTLING</div>
    <div class="alert-list" id="health-list"></div>
  </section>

  <section>
    <div class="advisory" id="other-failed"></div>
  </section>

  <section class="manifests">
    <div class="manifest-card">
      <div class="eyebrow">TOP CPU</div>
      <div class="rows" id="top-cpu"></div>
    </div>
    <div class="manifest-card">
      <div class="eyebrow">TOP MEMORY</div>
      <div class="rows" id="top-mem"></div>
    </div>
  </section>

</main>

<footer class="updated" id="updated"></footer>

<script>
  // Page-local helpers for the DNS panel. These lived in bazza.html's inline
  // block before the hostcard.js split; that refactor moved the shared subset
  // out and dropped these two by mistake, which broke renderDns().
  const num = n => (n == null ? '—' : Number(n).toLocaleString());
  function fmtAgo(sec) {
    if (sec == null) return '—';
    if (sec < 90) return 'just now';
    const m = Math.round(sec / 60);
    if (m < 90) return `${m} min ago`;
    const h = Math.round(sec / 3600);
    if (h < 36) return `${h}h ago`;
    return `${Math.round(sec / 86400)}d ago`;
  }

  async function loadHistory(cpus) {
    try {
      const r = await fetch('/api/bazza/history');
      const d = await r.json();
      renderHistory(d.points || [], cpus || 1);
    } catch {}
  }

  function renderDns(dns) {
    const card = document.getElementById('dns-card');
    if (!dns) { card.innerHTML = '<span class="chip none">no data</span>'; return; }

    const ftl = dns.ftl_active;
    const haveFigures = dns.percent_blocked != null;
    const strip = haveFigures ? `
      <div class="dns-strip">
        <span class="dns-big"><b>${dns.percent_blocked}%</b> blocked</span>
        <span class="dns-sub">${num(dns.total)} queries · ${num(dns.blocked)} blocked · ${num(dns.cached)} cached · ${num(dns.forwarded)} forwarded</span>
      </div>` : '';

    const unboundChip = dns.unbound_known
      ? `<span class="chip ${dns.unbound_active ? 'ok' : 'down'}">unbound ${dns.unbound_active ? 'active' : 'inactive'}</span>`
      : `<span class="chip none">unbound n/a</span>`;

    const gravity = dns.gravity_domains != null
      ? `<span class="chip">${num(dns.gravity_domains)} domains</span>` +
        (dns.gravity_last_update ? `<span class="chip">rebuilt ${fmtAgo(Math.floor(Date.now() / 1000) - dns.gravity_last_update)}</span>` : '')
      : `<span class="chip none">unknown</span>`;

    const staleNote = (dns.stale && dns.age_s != null)
      ? `<div class="dns-note">⚠ figures are ${fmtAgo(dns.age_s)} — the Pi-hole poller on steve is behind</div>` : '';

    card.innerHTML = `
      <div class="dns-head">
        <span class="lamp ${ftl ? 'on' : 'down'}"></span>
        <span class="dns-title">${ftl ? 'Pi-hole FTL active' : 'Pi-hole FTL not running'}</span>
      </div>
      ${strip}
      ${staleNote}
      <div class="dns-row"><span class="k">Resolvers</span>
        <span class="chip ${ftl ? 'ok' : 'down'}">pihole-FTL ${ftl ? 'active' : 'down'}</span>
        ${unboundChip}
      </div>
      <div class="dns-row"><span class="k">Gravity</span>${gravity}</div>
      <div class="dns-row"><span class="k">Top blocked</span>${
        dns.top_blocked
          ? `<span class="chip">${esc(dns.top_blocked.domain)}</span><span class="dns-sub">${num(dns.top_blocked.count)}</span>`
          : '<span class="chip none">—</span>'}</div>
      <div class="dns-row"><span class="k">Top client</span>${
        dns.top_client
          ? `<span class="chip">${esc(dns.top_client.name)}</span><span class="dns-sub">${num(dns.top_client.count)} queries</span>`
          : '<span class="chip none">—</span>'}</div>
    `;
  }

  function renderHealth(d) {
    const list = document.getElementById('health-list');
    const flags = (d.throttled && d.throttled.flags) || [];
    if (!d.throttled || !d.throttled.available) {
      list.innerHTML = `<div class="alert-item"><div class="alert-body"><div class="alert-item-top">
        <span class="alert-header">vcgencmd unavailable</span></div>
        <div class="alert-text">can't read the under-voltage / throttling bitfield on this host</div></div></div>`;
      return;
    }
    if (!flags.length) {
      list.innerHTML = `<div class="alert-item calm"><div class="alert-body"><div class="alert-item-top">
        <span class="alert-header">Clean</span></div>
        <div class="alert-text">no under-voltage or throttling flags set (${esc(d.throttled.raw)})</div></div></div>`;
      return;
    }
    list.innerHTML = flags.map(f => `
      <div class="alert-item ${f.level === 'critical' ? 'critical' : ''}">
        <div class="alert-body">
          <div class="alert-item-top">
            <span class="alert-header">${esc(f.header)}</span>
            <span class="alert-time">${f.when === 'now' ? 'happening now' : 'since boot'}</span>
          </div>
          <div class="alert-text">${esc(f.detail)}</div>
        </div>
      </div>`).join('');
  }

  // ── Alerts (each acknowledged individually — an ack is "id -> onset ts",
  // so a re-triggered episode with a fresh onset ts un-acks itself) ──
  const ACKS_KEY = 'bazza_alert_acks';
  async function load() {
    ensureGauges(true);
    try {
      const r = await fetch('/api/bazza');
      const d = await r.json();
      if (d.error) {
        document.getElementById('status-text').textContent = 'ERROR';
        document.getElementById('status-lamp').className = 'lamp down';
        document.getElementById('uname').textContent = esc(d.error);
        return;
      }

      const alertSummary = renderAlerts(d.alerts || [], ACKS_KEY);
      const lamp = document.getElementById('status-lamp');
      const statusText = document.getElementById('status-text');
      const lampCls = alertSummary.critical ? 'down' : alertSummary.count ? 'warn' : 'on';
      lamp.className = 'lamp ' + lampCls;
      statusText.textContent = alertSummary.count ? `${alertSummary.count} ALERT${alertSummary.count > 1 ? 'S' : ''}` : 'ALL SYSTEMS UP';

      document.getElementById('hostname').textContent = d.hostname;
      document.getElementById('uname').textContent =
        `${esc(d.model || 'Raspberry Pi')} · ${d.load.cpus} cores · up ${fmtUptime(d.uptime_seconds)}`;

      const loadPct = d.load['1m'] / d.load.cpus * 100;
      const loadCls = loadPct > 100 ? 'down' : loadPct > 70 ? 'warn' : 'ok';
      setGauge('load', loadPct, loadCls, d.load['1m'].toFixed(2), 'LOAD 1M', `${d.load['5m']} / ${d.load['15m']} · 5m/15m`);

      const memCls = d.mem.percent > 90 ? 'down' : d.mem.percent > 75 ? 'warn' : 'ok';
      setGauge('mem', d.mem.percent, memCls, d.mem.percent + '%', 'MEMORY', `${d.mem.used_mb.toLocaleString()} / ${d.mem.total_mb.toLocaleString()} MB`);

      const diskCls = d.disk.percent > 90 ? 'down' : d.disk.percent > 75 ? 'warn' : 'ok';
      setGauge('disk', d.disk.percent, diskCls, d.disk.percent + '%', 'DISK /', `${d.disk.used_gb} / ${d.disk.total_gb} GB`);

      if (d.cpu_temp != null) {
        const t = d.cpu_temp;
        const tCls = t >= 80 ? 'down' : t >= 65 ? 'warn' : 'ok';
        setGauge('temp', t / 90 * 100, tCls, Math.round(t) + '°', 'SOC TEMP', `${t} °C`);
      } else {
        setGauge('temp', 0, 'ok', '—', 'SOC TEMP', 'no sensor');
      }

      renderDns(d.dns);
      renderHealth(d);

      const otherFailed = document.getElementById('other-failed');
      otherFailed.textContent = d.other_failed && d.other_failed.length
        ? `Failed units: ${d.other_failed.join(', ')}` : '';

      document.getElementById('top-cpu').innerHTML = (d.top_cpu || []).map(procRow).join('') || '<div class="row"><span>—</span></div>';
      document.getElementById('top-mem').innerHTML = (d.top_mem || []).map(procRow).join('') || '<div class="row"><span>—</span></div>';

      markStale(d);
      loadHistory(d.load.cpus);
    } catch (e) {
      document.getElementById('status-text').textContent = 'OFFLINE';
      document.getElementById('status-lamp').className = 'lamp down';
    }
  }

  load();
  setInterval(load, 15000);
</script>
</body>
</html>
