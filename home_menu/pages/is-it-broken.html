<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Is It Broken?</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --chassis: #1c1e20;
      --card: #26282b;
      --border: #38393c;
      --ink: #eae7df;
      --ink-dim: #9ea1a5;
      --ink-faint: #909398;
      --ok: #6fb98a;
      --warn: #d7a24a;
      --down: #c9584a;
      --font-plate: 'Bahnschrift', 'DIN Alternate', 'Arial Narrow', sans-serif;
      --font-mono: ui-monospace, 'Cascadia Mono', 'SF Mono', 'DejaVu Sans Mono', Consolas, monospace;
    }

    body {
      font-family: var(--font-plate);
      background: var(--chassis);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(1.2rem, env(safe-area-inset-top)) max(1.1rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1.1rem, env(safe-area-inset-left));
      gap: 1rem;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 1rem; }

    /* Big status banner */
    #banner {
      border-radius: 16px;
      padding: 1.8rem 1.2rem;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      transition: background 0.4s ease, border-color 0.4s ease;
    }
    #banner .emoji { font-size: 3.6rem; line-height: 1; margin-bottom: 0.5rem; }
    #banner .headline { font-size: 1.5rem; font-weight: 700; line-height: 1.25; }
    #banner .subline { margin-top: 0.5rem; font-size: 0.95rem; color: var(--ink-dim); }
    #banner .client-line { margin-top: 0.6rem; font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.03em; color: var(--ink-faint); }

    #banner.ok   { background: color-mix(in srgb, var(--ok) 16%, var(--card));   border-color: color-mix(in srgb, var(--ok) 45%, var(--border)); }
    #banner.warn { background: color-mix(in srgb, var(--warn) 16%, var(--card)); border-color: color-mix(in srgb, var(--warn) 45%, var(--border)); }
    #banner.down { background: color-mix(in srgb, var(--down) 18%, var(--card)); border-color: color-mix(in srgb, var(--down) 50%, var(--border)); }

    #grownup {
      display: none;
      text-align: center;
      font-size: 0.95rem;
      color: var(--ink-dim);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem 1rem;
    }
    #grownup.show { display: block; }

    /* Check cards */
    .checks { display: flex; flex-direction: column; gap: 0.7rem; }
    .check {
      display: flex; align-items: center; gap: 0.9rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.9rem 1.1rem;
    }
    .check .icon { font-size: 1.8rem; line-height: 1; flex-shrink: 0; }
    .check .body { flex: 1; min-width: 0; }
    .check .name { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-faint); }
    .check .line { font-size: 1.05rem; font-weight: 600; margin-top: 0.15rem; }
    .check .detail { font-size: 0.85rem; color: var(--ink-dim); margin-top: 0.15rem; }

    .lamp {
      width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0;
      background: var(--ink-faint); box-shadow: inset 0 1px 2px rgba(0,0,0,0.4);
    }
    .lamp.ok   { background: var(--ok);   box-shadow: 0 0 10px 2px color-mix(in srgb, var(--ok) 60%, transparent); }
    .lamp.warn { background: var(--warn); box-shadow: 0 0 10px 2px color-mix(in srgb, var(--warn) 60%, transparent); }
    .lamp.down { background: var(--down); box-shadow: 0 0 12px 3px color-mix(in srgb, var(--down) 70%, transparent); animation: pulse-lamp 1.6s ease-in-out infinite; }
    @keyframes pulse-lamp { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    footer {
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.05em;
      color: var(--ink-faint);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="banner">
      <div class="emoji" id="banner-emoji">🤔</div>
      <div class="headline" id="banner-headline">Checking…</div>
      <div class="subline" id="banner-subline"></div>
      <div class="client-line" id="banner-client"></div>
    </div>

    <div id="grownup">👋 Go tell a grown-up something's not working.</div>

    <div class="checks">
      <div class="check" id="c-internet">
        <div class="lamp"></div>
        <div class="icon">🌍</div>
        <div class="body">
          <div class="name">Internet</div>
          <div class="line">Checking…</div>
          <div class="detail"></div>
        </div>
      </div>
      <div class="check" id="c-wifi">
        <div class="lamp"></div>
        <div class="icon">📶</div>
        <div class="body">
          <div class="name">WiFi</div>
          <div class="line">Checking…</div>
          <div class="detail"></div>
        </div>
      </div>
      <div class="check" id="c-speed">
        <div class="lamp"></div>
        <div class="icon">⚡</div>
        <div class="body">
          <div class="name">Speed test</div>
          <div class="line">Checking…</div>
          <div class="detail"></div>
        </div>
      </div>
    </div>

    <footer id="updated"></footer>
  </div>

  <script>
    const CHECK_META = {
      internet: { name: 'Internet', ok: 'Working great!', warn: "Working, but a bit odd", down: "It's down" },
      wifi:     { name: 'WiFi',     ok: 'Working great!', warn: 'Kinda working', down: "It's down" },
      speed:    { name: 'Speed test', ok: 'Nice and fast!', warn: 'No test yet', down: "It's down" },
    };

    const BANNER = {
      ok:   { emoji: '🎉', headline: "Yep, it's all working!", subline: "Nothing's broken right now." },
      warn: { emoji: '😬', headline: "Something's being weird", subline: 'Might just sort itself out.' },
      down: { emoji: '💥', headline: "Yeah, it's actually broken", subline: "That's why nothing's loading." },
    };

    function render(data) {
      const b = BANNER[data.overall] || BANNER.warn;
      document.getElementById('banner').className = data.overall;
      document.getElementById('banner-emoji').textContent = b.emoji;
      document.getElementById('banner-headline').textContent = b.headline;
      document.getElementById('banner-subline').textContent = b.subline;
      document.getElementById('banner-client').textContent =
        data.client_ip ? `Checking from ${data.client_ip}${data.client_device ? ' · ' + data.client_device : ''}` : '';
      document.getElementById('grownup').classList.toggle('show', data.overall !== 'ok');

      for (const [key, meta] of Object.entries(CHECK_META)) {
        const el = document.getElementById('c-' + key);
        if (!el) continue;
        const c = (data.checks || {})[key] || { state: 'warn', detail: '' };
        el.querySelector('.lamp').className = 'lamp ' + c.state;
        el.querySelector('.line').textContent = meta[c.state] || meta.warn;
        el.querySelector('.detail').textContent = c.detail || '';
      }

      const t = data.ts ? new Date(data.ts * 1000) : new Date();
      document.getElementById('updated').textContent =
        'Last checked ' + t.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    }

    async function refresh() {
      try {
        const c = new AbortController();
        const timer = setTimeout(() => c.abort(), 4000);
        const r = await fetch('/api/is-it-broken', { signal: c.signal });
        clearTimeout(timer);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        render(await r.json());
      } catch {
        document.getElementById('banner').className = 'down';
        document.getElementById('banner-emoji').textContent = '📴';
        document.getElementById('banner-headline').textContent = "Can't even check right now";
        document.getElementById('banner-subline').textContent = 'The status page itself is offline.';
        document.getElementById('grownup').classList.add('show');
      }
    }

    refresh();
    setInterval(refresh, 15000);
  </script>
</body>
</html>
