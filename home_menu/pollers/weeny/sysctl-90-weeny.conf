# weeny -- allow binding an address that isn't up yet.
# Deploy: sudo install -m0644 sysctl-90-weeny.conf /etc/sysctl.d/90-weeny.conf
#         sudo sysctl --system
#
# OpenCanary binds 192.168.1.5 explicitly (device.listen_addr). During boot, and
# whenever comitup is in hotspot mode, that address may not exist on wlan0 yet --
# without this, the bind fails and the service crash-loops. Also permanently
# defuses the ListenAddress-style race that locked us out on 2026-09-06.

net.ipv4.ip_nonlocal_bind = 1
