# weeny -- keep the real sshd alive no matter what.
# Deploy: sudo install -Dm0644 ssh-restart.conf \
#             /etc/systemd/system/ssh.service.d/restart.conf
#         sudo systemctl daemon-reload
#
# Belt-and-braces on top of the "no ListenAddress" fix: if sshd ever does exit
# (bad config reload, transient bind failure), systemd brings it straight back
# instead of leaving the box dark. Debian ships RestartPreventExitStatus=255 and
# sshd exits 255 on a bind failure -- clear it so that case still restarts.
#
# Requires ssh running as a standalone daemon (ssh.service), NOT socket-activated
# (ssh.socket) -- provision.sh disables the socket. Under socket activation this
# drop-in is inert and `Port 2222` in sshd_config is ignored.

[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=5
RestartPreventExitStatus=
