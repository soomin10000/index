#!/usr/sbin/nft -f
# weeny -- firewall. Deploy: sudo install -m0644 nftables.conf /etc/nftables.conf
#          sudo nft -c -f /etc/nftables.conf   # syntax check
#          sudo systemctl enable --now nftables
#
# Purpose: the real OpenSSH listens on *:2222 (all addresses). Drop it on the
# honeypot's bait IP so a scanner hitting 192.168.1.5 never sees a real sshd --
# only OpenCanary's fake banner on 192.168.1.5:22. Admin SSH stays reachable on
# 192.168.1.247:2222.
#
# CRITICAL: no `flush ruleset` here, and never `systemctl stop nftables`.
# comitup manages its own COMITUP-OUT / COMITUP-FWD chains in `table ip filter`
# and `table ip nat`; flushing everything (which Debian's nftables.service
# ExecStop does) would tear those out from under comitup. We only own our own
# named table and recreate just that.

table inet weeny
delete table inet weeny

table inet weeny {
    chain input {
        type filter hook input priority filter; policy accept;

        # bait IP must never expose the real OpenSSH
        ip daddr 192.168.1.5 tcp dport 2222 drop

        # Optional hardening once the persona is verified -- hide anything on the
        # bait IP that isn't a honeypot service (avahi, dhcp client, etc.):
        # ip  daddr 192.168.1.5 tcp dport != { 21, 22, 23, 80 } drop
        # ip  daddr 192.168.1.5 udp drop
    }
}
