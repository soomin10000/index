# weeny -- comitup: headless Wi-Fi re-provisioning via a phone.
# Deploy: rendered by provision.sh (it appends `ap_password:` from secrets.env)
#         to /etc/comitup.conf, then `systemctl restart comitup`.
#
# NO `web_service:` line. Last build set `web_service: opencanary.service` so
# comitup would stop the honeypot in hotspot mode (comitup-web needs 0.0.0.0:80,
# which the kernel refuses while OpenCanary holds 192.168.1.5:80). That worked
# but it also disabled opencanary.service's own enablement -- the honeypot then
# only ran if comitup was healthy. Instead we use external_callback (see
# comitup-callback): it drops /run/comitup-hotspot and stops opencanary on
# HOTSPOT, removes the flag and starts it on CONNECTED. opencanary.service is
# enabled in its own right and has ConditionPathExists=!/run/comitup-hotspot.

ap_name: weeny-<nnnn>
external_callback: /usr/local/bin/comitup-callback
# ap_password: <appended by provision.sh from secrets.env COMITUP_AP_PASSWORD>

# verbose: 1     # uncomment to trace state changes in /var/log/comitup.log
