# weeny -- real OpenSSH admin access.
# Deploy: sudo install -m0644 sshd-10-weeny.conf /etc/ssh/sshd_config.d/10-weeny.conf
#         sudo sshd -t && sudo systemctl reload ssh
#
# Sorts before cloud-init's 50-cloud-init.conf; for Port/ListenAddress the FIRST
# match in the merged config wins, so this file decides the port.
#
# NEVER add `ListenAddress` here. On 2026-09-06 `ListenAddress 192.168.1.247`
# made sshd fail to bind on cold boot (it starts before NetworkManager assigns
# the address) and exit with no fallback listener -- one card-pull. Port 2222 on
# the wildcard address has nothing to race: it binds regardless of which IPs
# exist yet. The honeypot keeps the interesting port (22 on 192.168.1.5); an
# nft rule drops 192.168.1.5:2222 so the bait IP never reveals a real OpenSSH.

Port 2222
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitRootLogin no
