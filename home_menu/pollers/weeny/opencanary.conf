{
    "device.node_id": "weeny-hp",
    "device.listen_addr": "192.168.1.5",

    "ip.ignorelist": [ "192.168.1.183" ],
    "logtype.ignorelist": [ ],

    "ftp.enabled": true,
    "ftp.port": 21,
    "ftp.banner": "NAS FTP service ready",
    "ftp.log_auth_attempt_initiated": true,

    "telnet.enabled": true,
    "telnet.port": 23,
    "telnet.banner": "",
    "telnet.honeycreds": [
        { "username": "admin", "password": "admin" },
        { "username": "root",  "password": "root" }
    ],
    "telnet.log_tcp_connection": true,

    "http.enabled": true,
    "http.port": 80,
    "http.banner": "lighttpd/1.4.59",
    "http.skin": "nasLogin",
    "http.log_unimplemented_method_requests": true,
    "http.log_redirect_request": false,

    "ssh.enabled": true,
    "ssh.port": 22,
    "ssh.version": "SSH-2.0-OpenSSH_7.4p1 Debian-10",
    "ssh.key_path": "/var/lib/opencanary",

    "git.enabled": false,
    "https.enabled": false,
    "httpproxy.enabled": false,
    "llmnr.enabled": false,
    "smb.enabled": false,
    "mysql.enabled": false,
    "mssql.enabled": false,
    "redis.enabled": false,
    "rdp.enabled": false,
    "sip.enabled": false,
    "snmp.enabled": false,
    "ntp.enabled": false,
    "tftp.enabled": false,
    "vnc.enabled": false,
    "tcpbanner.enabled": false,
    "tcpbanner_1.enabled": false,
    "portscan.enabled": false,

    "logger": {
        "class": "PyLogger",
        "kwargs": {
            "formatters": {
                "plain": { "format": "%(message)s" }
            },
            "handlers": {
                "file": {
                    "class": "logging.handlers.WatchedFileHandler",
                    "filename": "/var/log/opencanary/opencanary.log",
                    "formatter": "plain"
                }
            }
        }
    }
}
