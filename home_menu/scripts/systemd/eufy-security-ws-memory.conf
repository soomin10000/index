# Drop-in: /etc/systemd/system/eufy-security-ws.service.d/memory.conf
#
# eufy-security-server (node) sat at ~325-460M RSS with a 499M peak over 42h —
# node GC is lazy so some of that is just uncollected headroom, but cap it so a
# real leak can't pressure the box. MemoryHigh nudges V8 to collect under
# pressure; MemoryMax is the hard ceiling (Restart=on-failure recovers it).
[Service]
MemoryHigh=550M
MemoryMax=750M
