# Drop-in: /etc/systemd/system/unifi-poller.service.d/memory.conf
#
# Backstop for the slow RSS ratchet from matplotlib re-rendering (the poll loop
# now throttles visuals to every 3rd poll and windows the dashboard queries to
# 21 days, which should keep it well under 300M — old peak was 503M). MemoryHigh
# applies reclaim pressure; MemoryMax is a hard cap that OOM-kills the cgroup,
# and Restart=on-failure in the main unit then brings it straight back.
[Service]
MemoryHigh=500M
MemoryMax=650M
